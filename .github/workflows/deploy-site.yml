name: Legacy static site deploy (manual)

# 历史静态站点维护工具。
# 当前正式智能账本位于 smart-ledger-2026.ntr133.chatgpt.site，
# 由 ntr361-bot/smart-ledger-2026 单独发布；本工作流不属于正式智能账本发布链。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: legacy-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload legacy static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy legacy site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
