name: Verify Six Stage Stability (no predictions)
on:
  push:
    branches: [fix/six-stage-stability-20261012]
  pull_request:
    paths:
      - 'DailyPredictionAutomation.cs'
      - 'StableSnapshotFile.cs'
      - 'PredictionRunner/**'
      - 'Tests/PipelineSettlementSmoke*'
      - 'scripts/pipeline_guard.py'
      - 'scripts/test_pipeline_guard.py'
      - '.github/workflows/*'
permissions:
  contents: read
jobs:
  isolated-validation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_pipeline_guard.py -v
      - name: Validate unchanged committed snapshot
        run: python scripts/pipeline_guard.py validate
      - run: dotnet build PredictionRunner/PredictionRunner.csproj -c Release
      - run: dotnet build Tests/PipelineSettlementSmoke.csproj -c Release
      - name: Test settlement with copied archives and temporary database only
        env:
          LIUHE_DATA_DIR: ${{ runner.temp }}/pipeline-stability-test
        run: dotnet run --project Tests/PipelineSettlementSmoke.csproj -c Release --no-build
      - name: Confirm committed predictions and model state were not changed
        run: git diff --exit-code -- site/data
