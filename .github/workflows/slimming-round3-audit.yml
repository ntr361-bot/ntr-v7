name: Temporary slimming round3 audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/slimming-round3-audit.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore PredictionRunner/PredictionRunner.csproj
      - run: dotnet build PredictionRunner/PredictionRunner.csproj --configuration Release --no-restore
      - run: dotnet restore Tests/六合分析软件.SmokeTests.csproj
      - run: dotnet build Tests/六合分析软件.SmokeTests.csproj --configuration Release --no-restore
# rerun
