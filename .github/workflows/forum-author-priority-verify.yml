name: Forum author-priority isolated verification
on:
  push:
    branches: [fix/forum-author-one-vote-priority-20261015]
    paths:
      - '.github/workflows/forum-author-priority-verify.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: forum-observer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local regression dependencies
        run: pip install playwright pillow
      - name: Compile
        run: python -m compileall -q forum_observer tests
      - name: Run entire offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Download preserved 287 pre-draw collector evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p one-vote-287-input
          gh run download 38558406561 --repo ntr361-bot/ntr-v7 --name forum-observer-status --dir one-vote-287-input
      - name: Replay 287 with author cap, without publication
        run: |
          python -u - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from forum_observer.page_collector import score_posts
          from forum_observer.core import SCORING_RULE_VERSION, ZODIACS
          files=[f for f in Path('one-vote-287-input').rglob('status.json') if f.is_file()]
          pre=[(f,json.loads(f.read_text(encoding='utf-8'))) for f in files]
          pre=[(f,a) for f,a in pre if a.get('issue')=='2026287' and len(a.get('evidence',[]))>=100]
          if not pre:raise RuntimeError('missing original 287 pre-draw evidence')
          source,old=max(pre,key=lambda x:len(x[1]['evidence']))
          posts=old['evidence']
          if len(posts)!=493:raise RuntimeError('287 historical source posts unexpected')
          ranking,entries=score_posts(posts)
          adopted=[e for e in entries if e.get('counted_for_ranking')]
          authors=[e['author'].strip().casefold() for e in adopted]
          assert len(authors)==len(set(authors)),'duplicate author vote'
          assert len(adopted)>0 and len(ranking)==12
          dandan=[e for e in adopted if e['author'] in ('贝贝丹丹','發財沙发')]
          assert len(dandan)==2,'these two original authors must each have one eligible vote'
          assert all(e['mode']=='include' and len(e['picks'])==8 for e in dandan),dandan
          summary={
            'issue':'2026287',
            'input':'original-2026-10-14-pre-draw-artifact',
            'input_493':len(posts),
            'old_frozen_valid_materials':53,
            'prior_replay_valid_materials':77,
            'new_valid_materials':len(adopted),
            'distinct_authors':len(set(authors)),
            'rule_version':SCORING_RULE_VERSION,
            'selected_repost_author_materials':[{'author':r['author'],'play':r['play'],'source_url':r['source_url'],'picks':r['picks']} for r in dandan],
            'top6':[r['zodiac'] for r in ranking[:6]],
            'ranking':ranking,
            'play_counts':dict(Counter(r['play'] for r in adopted)),
            'never_replaces_frozen_snapshot':True
          }
          Path('one-vote-287').mkdir(exist_ok=True)
          Path('one-vote-287/summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False),encoding='utf-8')
          print('FORUM_287_ONE_VOTE_RETEST '+json.dumps(summary,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-287-author-one-vote-validation
          path: forum-observer/one-vote-287/
          retention-days: 30
          if-no-files-found: warn
