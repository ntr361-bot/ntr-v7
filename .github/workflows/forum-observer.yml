name: Forum observer daily cycle
on:
  workflow_dispatch:
  # User decision 2026-10-26: ONE nightly collection at 20:20 Beijing. The
  # 20:00 first-round and 20:30 second-round cron slots are removed (and
  # rejected by forum_observer.schedule if ever delivered). Manual collection
  # (workflow_dispatch or trigger(forum-collect-manual)) has no time or count
  # limit before 21:00 and replaces the draft; from 21:00 it is a test run
  # (artifact only, never a draft/freeze; waits until tonight's freeze exists).
  schedule:
    # Independent backup for the 20:20 collection (UTC 12:20/12:25); skips
    # when tonight's draft already exists, rejected outside 20:20-20:58.
    - cron: '20,25 12 * * *'
    # Beijing 21:00 final freeze (and best-effort 21:05/21:10 backups).
    - cron: '0,5,10 13 * * *'
  # GitHub cron delivery has been observed hours late (2026-10-16..20), so an
  # external scheduler pushes markers to the isolated trigger branch:
  #   trigger(forum-collect-1): ~20:16-20:20 (the single 20:20 collection;
  #   trigger(forum-collect-2) is retired and rejected),
  #   trigger(forum-freeze): ~21:01 (same 21:00-21:20 window and write-once
  #   snapshot guard as the 21:00 cron; never valid outside that window).
  # Push events run THIS file from the trigger branch: keep both copies in sync.
  # Always check out main for collection; trigger files never enter main.
  push:
    branches: [forum-gpt-trigger]
    paths:
      - 'forum-observer/triggers/**'
permissions:
  contents: write
concurrency:
  group: forum-observer-archive
  cancel-in-progress: false
defaults:
  run:
    working-directory: forum-observer
jobs:
  forum-cycle:
    if: ${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'trigger(forum-retro286):') && !startsWith(github.event.head_commit.message, 'trigger(forum):') && !startsWith(github.event.head_commit.message, 'trigger(forum-collect):')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record workflow startup
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m forum_observer.runtime starting
      - name: Align GPT collection trigger to its assigned round
        if: github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'trigger(forum-collect-1):') || startsWith(github.event.head_commit.message, 'trigger(forum-collect-2):'))
        env:
          GPT_ROUND_TWO: ${{ startsWith(github.event.head_commit.message, 'trigger(forum-collect-2):') }}
        run: |
          if [ "$GPT_ROUND_TWO" = "true" ]; then
            python -m forum_observer.schedule --align-gpt-trigger --gpt-second-round
          else
            python -m forum_observer.schedule --align-gpt-trigger
          fi
      - name: Decide current-issue collection
        id: collection-gate
        # Scheduled backup, GPT collect marker, or manual dispatch may enter; snapshot gate prevents re-freezing.
        # Audit/settlement/reconciliation triggers must never collect new evidence.
        if: (github.event_name == 'schedule' && github.event.schedule != '0,5,10 13 * * *') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'trigger(forum-collect-1):') || startsWith(github.event.head_commit.message, 'trigger(forum-collect-2):') || startsWith(github.event.head_commit.message, 'trigger(forum-collect-manual):')))
        env:
          MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-collect-manual):')) }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'trigger(forum-collect-1):') || startsWith(github.event.head_commit.message, 'trigger(forum-collect-2):'))) }}
          FORUM_SCHEDULE_CRON: ${{ github.event.schedule }}
          FORUM_REQUESTED_ROUND: ${{ startsWith(github.event.head_commit.message, 'trigger(forum-collect-1):') && '1' || (startsWith(github.event.head_commit.message, 'trigger(forum-collect-2):') && '2' || '') }}
        run: |
          if [ "$MANUAL_DISPATCH" = "true" ]; then
            python -m forum_observer.schedule --archive archive --github-output "$GITHUB_OUTPUT" --manual
          else
            python -m forum_observer.schedule --archive archive --github-output "$GITHUB_OUTPUT" --scheduled
          fi
      - name: Reject delayed scheduled collection
        if: steps.collection-gate.outputs.reason == 'scheduled_event_outside_collection_window' || steps.collection-gate.outputs.reason == 'requested_round_outside_window' || steps.collection-gate.outputs.reason == 'retired_schedule_trigger'
        run: |
          echo "::error::Retired or delayed forum trigger rejected; only the single 20:20 collection (trigger(forum-collect-1)) may collect, inside 20:20-20:58."
          exit 1
      - name: Restore Scrapling adaptive selector history
        if: steps.collection-gate.outputs.collect == 'true'
        uses: actions/cache/restore@v4
        with:
          path: forum-observer/.scrapling/
          key: forum-scrapling-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            forum-scrapling-${{ runner.os }}-
      - name: Install text collector
        if: steps.collection-gate.outputs.collect == 'true'
        run: |
          pip install playwright "scrapling==0.5"
          python -m playwright install --with-deps chromium
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/cache/restore@v4
        with:
          path: |
            forum-observer/.image-cache/
          key: forum-images-${{ runner.os }}-${{ github.run_id }}
          restore-keys: forum-images-${{ runner.os }}-
      - name: Observe current issue
        # GPT/manual triggers are idempotent; never rescan a frozen issue.
        if: steps.collection-gate.outputs.collect == 'true'
        id: observe
        continue-on-error: true
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-collect-manual):')) }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'trigger(forum-collect-1):') || startsWith(github.event.head_commit.message, 'trigger(forum-collect-2):'))) }}
          FORUM_SCHEDULE_CRON: ${{ github.event.schedule }}
          FORUM_REQUESTED_ROUND: ${{ startsWith(github.event.head_commit.message, 'trigger(forum-collect-1):') && '1' || (startsWith(github.event.head_commit.message, 'trigger(forum-collect-2):') && '2' || '') }}
          FORUM_COLLECTION_ROUND: ${{ steps.collection-gate.outputs.collection_round }}
          SCHEDULE_GATE_REASON: ${{ steps.collection-gate.outputs.reason }}
        run: python -u -m forum_observer.runtime supervise
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            forum-observer/.image-cache/
          key: forum-images-${{ runner.os }}-${{ github.run_id }}
      - name: Save Scrapling adaptive selector history
        if: always() && steps.collection-gate.outputs.collect == 'true'
        uses: actions/cache/save@v4
        with:
          path: forum-observer/.scrapling/
          key: forum-scrapling-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Ensure nightly issue report even if collection produced no data
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-audit):')
        run: python -m forum_observer.schedule --archive archive --ensure-report
      - name: Check nightly freeze window (21:00 cron or trigger(forum-freeze) marker)
        id: freeze-window
        if: ${{ ((github.event_name == 'schedule' && github.event.schedule == '0,5,10 13 * * *') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-freeze):'))) }}
        run: python -m forum_observer.schedule --archive archive --github-output "$GITHUB_OUTPUT" --check-freeze-window
      - name: Reject delayed scheduled freeze
        if: steps.freeze-window.outputs.allowed == 'false'
        run: |
          echo "::error::Forum freeze (cron or trigger(forum-freeze) marker) arrived outside today's 21:00-21:20 Asia/Shanghai window; no late freeze was attempted."
          exit 1
      - name: Publish completed-run report or finalize nightly freeze
        # A manual run after the freeze time is a test: results stay in the
        # workflow artifact; no draft, report or archive change.
        if: steps.collection-gate.outputs.reason != 'manual_test_after_freeze'
        env:
          FORUM_COLLECTION_ROUND: ${{ steps.collection-gate.outputs.collection_round }}
          FINALIZE_CYCLE: ${{ ((github.event_name == 'schedule' && github.event.schedule == '0,5,10 13 * * *') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-freeze):'))) }}
        run: |
          if [ "$FINALIZE_CYCLE" = "true" ]; then
            python -m forum_observer.cycle --out out --archive archive --history ../site/data/history.json --public ../site/data/forum-observer --finalize
          else
            # An observation report is published after every completed scan.
            # Do not create immutable predictions until the 21:00 finalizer.
            python -m forum_observer.cycle --out out --archive archive --history ../site/data/history.json --public ../site/data/forum-observer --defer-freeze
          fi
      - name: Record author history from verified frozen evidence only
        # Separate append-only author memory; no scraping, score updates or frozen edits.
        run: python -m forum_observer.author_profiles --archive archive
      - name: Archive independent forum data only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/ ../site/data/forum-observer/
          if git diff --cached --quiet; then
            echo "No forum archive changes"
            exit 0
          fi
          git commit -m "chore(forum): archive independent observer cycle"
          for attempt in 1 2 3; do
            git fetch origin main
            # Old runs must never rebase a stale collector's archive onto
            # a newer parser/rule revision, especially frozen predictions.
            # Workflow-only changes are not scoring-rule changes and must not
            # silently discard a generated incomplete-status report.
            if ! git -C .. diff --quiet HEAD origin/main -- \
                 forum-observer/forum_observer/ \
                 forum-observer/collector-config.json; then
              echo "A newer collector revision exists on main; skip stale archive publication."
              exit 0
            fi
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - name: Audit immutable current-issue snapshot (GPT audit only)
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-audit):')
        run: python -m forum_observer.schedule --archive archive --require-snapshot
      - name: Report status
        if: always()
        shell: bash
        run: |
          if [ -f out/status.json ]; then
            python -c "import json; a=json.load(open('out/status.json')); print({k:a.get(k) for k in ('issue','status','raw_count','top6','audit','author_selection')})"
          fi
          if [ -f archive/summary.json ]; then cat archive/summary.json; fi
          if [ -f out/collection-error.json ]; then cat out/collection-error.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-observer-status
          path: |
            forum-observer/out/
            forum-observer/archive/latest.json
            forum-observer/archive/summary.json
            site/data/forum-observer/latest.json
            site/data/forum-observer/history.json
          if-no-files-found: ignore
      - name: Enforce collection quality
        # A completed collection must publish its draft report, not freeze early.
        if: always() && steps.observe.outcome != 'skipped' && steps.collection-gate.outputs.reason != 'manual_test_after_freeze'
        shell: bash
        run: |
          if [ -f out/status.json ]; then
            python -c "import json,sys,pathlib; a=json.load(open('out/status.json')); f=pathlib.Path('archive/issues')/str(a.get('issue',''))/'draft-status.json'; p=pathlib.Path('archive/issues')/str(a.get('issue',''))/'report.md'; ok=f.is_file() and p.is_file(); print('Published collector report:',p,'valid_materials:',a.get('valid_materials',0),'minimum:',a.get('author_selection',{}).get('min_valid_materials',25));sys.exit(0 if ok else 2)"
          else
            echo "No collector status"; exit 2
          fi

      - name: Publish independent monitor status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVE_OUTCOME: ${{ steps.observe.outcome }}
          JOB_STATUS: ${{ job.status }}
          GATE_COLLECT: ${{ steps.collection-gate.outputs.collect }}
          SCHEDULE_GATE_REASON: ${{ steps.collection-gate.outputs.reason || steps.freeze-window.outputs.reason }}
          FINALIZE_CYCLE: ${{ ((github.event_name == 'schedule' && github.event.schedule == '0,5,10 13 * * *') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-freeze):'))) }}
        run: python -m forum_observer.runtime finished
      - name: Preserve complete monitor journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            forum-observer/out/monitor/
            forum-observer/out/runtime-monitor/
            forum-observer/out/runtime.json
            forum-observer/out/status.json
            forum-observer/out/collection-error.json
            forum-observer/out/scrapling-assist.json
          if-no-files-found: warn

  forum-286-retrospective:
    # Explicit one-off run only. Never called by daily collection or 21:00 freeze.
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-retro286):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - name: Checkout current collector and preserved frozen baseline
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public forum browser (no OCR)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run collector unit tests
        working-directory: forum-observer
        run: python -m unittest discover -s tests -q
      - name: Crawl all reachable 286 text, comments and score independently
        id: backtest
        working-directory: forum-observer
        continue-on-error: true
        run: |
          python -u -m forum_observer.full_backtest \
            --issue 2026286 --config collector-config.json \
            --out backtest-286 --snapshot archive/issues/2026286/snapshot.json
      - name: Upload isolated historical evidence and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-286-exhaustive-text-backtest
          path: |
            forum-observer/backtest-286/
          retention-days: 30
          if-no-files-found: warn
      - name: Verify independent recognizable-evidence scoring and retain coverage warnings
        if: always()
        working-directory: forum-observer
        run: |
          python -c "import json,pathlib,sys; p=pathlib.Path('backtest-286/comparison.json'); ok=p.is_file() and json.loads(p.read_text()).get('status')=='recognized_valid_evidence_scored'; print('Retrospective complete and comparable:',ok); sys.exit(0 if ok else 2)"
