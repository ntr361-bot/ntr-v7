name: Forum observer daily cycle
run-name: ${{ inputs.request_id && format('Forum 118 {0} manual#{1}', inputs.mode, inputs.request_id) || (github.event_name == 'workflow_dispatch' && format('Forum 118 {0}', inputs.mode || 'collect')) || (github.event_name == 'schedule' && format('Forum 118 scheduled {0}', (github.event.schedule == '0 13 * * *' || github.event.schedule == '5 13 * * *') && 'freeze' || 'collect')) || 'Forum observer daily cycle' }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Dispatcher correlation id (blank for direct manual use)
        required: false
        default: ''
      issue:
        description: Current issue pinned by the dispatcher (optional)
        type: string
        required: false
      mode:
        description: collect | freeze current draft
        type: choice
        options: [collect, freeze]
        required: false
        default: collect
  # Automatic collection backups remain at the existing slots; any delayed or
  # manual collection can start 24 hours. Freeze remains at 21:00/21:05.
  schedule:
    - cron: "25 12 * * *"
    - cron: "0 13 * * *"
    - cron: "5 13 * * *"
  # Legacy collection markers may still arrive.
  # Push events run THIS file from the trigger branch and always check out main.
  push:
    branches: [forum-gpt-trigger]
    paths:
      - 'forum-observer/triggers/**'
permissions:
  contents: write
  actions: read
defaults:
  run:
    working-directory: forum-observer
jobs:
  forum-cycle:
    if: ${{ (github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'trigger(forum-retro286):') && !startsWith(github.event.head_commit.message, 'trigger(forum):') && !startsWith(github.event.head_commit.message, 'trigger(forum-collect):'))) && !((github.event_name == 'workflow_dispatch' && inputs.mode == 'freeze') || (github.event_name == 'schedule' && (github.event.schedule == '0 13 * * *' || github.event.schedule == '5 13 * * *')) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-freeze):'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: forum-observer-collection
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record workflow startup
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m forum_observer.runtime starting
      - name: Decide current-issue collection
        id: collection-gate
        # Existing backup schedule and manual/GPT triggers may enter at any time; snapshots remain immutable.
        # Audit/settlement/reconciliation triggers must never collect new evidence.
        if: (github.event_name == 'workflow_dispatch' && inputs.mode != 'freeze') || (github.event_name == 'schedule' && github.event.schedule == '25 12 * * *') || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'trigger(forum-collect-1):') || startsWith(github.event.head_commit.message, 'trigger(forum-collect-2):') || startsWith(github.event.head_commit.message, 'trigger(forum-collect-manual):')))
        env:
          MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-collect-manual):')) }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'trigger(forum-collect-1):') || startsWith(github.event.head_commit.message, 'trigger(forum-collect-2):'))) }}
          FORUM_SCHEDULE_CRON: ${{ github.event.schedule }}
          FORUM_REQUESTED_ROUND: ${{ startsWith(github.event.head_commit.message, 'trigger(forum-collect-1):') && '1' || (startsWith(github.event.head_commit.message, 'trigger(forum-collect-2):') && '2' || '') }}
        run: |
          if [ "$MANUAL_DISPATCH" = "true" ]; then
            python -m forum_observer.schedule --archive archive --github-output "$GITHUB_OUTPUT" --manual
          else
            python -m forum_observer.schedule --archive archive --github-output "$GITHUB_OUTPUT" --scheduled
          fi
      - name: Match dispatcher issue
        if: inputs.issue != ''
        env:
          REQUESTED_ISSUE: ${{ inputs.issue }}
          CURRENT_ISSUE: ${{ steps.collection-gate.outputs.issue }}
        run: test "$REQUESTED_ISSUE" = "$CURRENT_ISSUE"
      - name: Install text collector
        if: steps.collection-gate.outputs.collect == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Fast collector code check (full suite runs in PR regression CI)
        run: python -m compileall -q forum_observer
      - uses: actions/cache/restore@v4
        with:
          path: |
            forum-observer/.image-cache/
          key: forum-images-${{ runner.os }}-${{ github.run_id }}
          restore-keys: forum-images-${{ runner.os }}-
      - name: Observe current issue
        # Formal archive remains immutable; post-freeze scans stay isolated.
        if: steps.collection-gate.outputs.collect == 'true'
        id: observe
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-collect-manual):')) }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'trigger(forum-collect-1):') || startsWith(github.event.head_commit.message, 'trigger(forum-collect-2):'))) }}
          FORUM_SCHEDULE_CRON: ${{ github.event.schedule }}
          FORUM_REQUESTED_ROUND: ${{ startsWith(github.event.head_commit.message, 'trigger(forum-collect-1):') && '1' || (startsWith(github.event.head_commit.message, 'trigger(forum-collect-2):') && '2' || '') }}
          FORUM_GATE_ISSUE: ${{ steps.collection-gate.outputs.issue }}
          FORUM_COLLECTION_ROUND: ${{ steps.collection-gate.outputs.collection_round }}
          SCHEDULE_GATE_REASON: ${{ steps.collection-gate.outputs.reason }}
        run: python -u -m forum_observer.runtime supervise
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            forum-observer/.image-cache/
          key: forum-images-${{ runner.os }}-${{ github.run_id }}
      - name: Publish and verify committed current-run draft
        if: steps.collection-gate.outputs.collect == 'true' && steps.collection-gate.outputs.reason != 'manual_test_after_freeze' && steps.observe.outcome == 'success'
        env:
          ISSUE: ${{ steps.collection-gate.outputs.issue }}
          FORUM_COLLECTION_ROUND: ${{ steps.collection-gate.outputs.collection_round }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m forum_observer.publish_collection forum-observer out "$ISSUE"
      - name: Audit immutable current-issue snapshot (GPT audit only)
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-audit):')
        run: python -m forum_observer.schedule --archive archive --require-snapshot
      - name: Report status
        if: always()
        shell: bash
        run: |
          if [ -f out/status.json ]; then
            python -c "import json; a=json.load(open('out/status.json')); print({k:a.get(k) for k in ('issue','status','raw_count','top6','audit','author_selection')})"
          fi
          if [ -f archive/summary.json ]; then cat archive/summary.json; fi
          if [ -f out/collection-error.json ]; then cat out/collection-error.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-observer-status
          path: |
            forum-observer/out/
            forum-observer/archive/latest.json
            forum-observer/archive/summary.json
            site/data/forum-observer/latest.json
            site/data/forum-observer/history.json
          if-no-files-found: ignore
      - name: Check isolated observation evidence
        if: steps.collection-gate.outputs.reason == 'manual_test_after_freeze'
        env:
          ISSUE: ${{ steps.collection-gate.outputs.issue }}
        run: python -m forum_observer.publish_collection forum-observer out "$ISSUE" --observation
      - name: Publish independent monitor status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FORUM_GATE_ISSUE: ${{ steps.collection-gate.outputs.issue }}
          OBSERVE_OUTCOME: ${{ steps.observe.outcome }}
          JOB_STATUS: ${{ job.status }}
          GATE_COLLECT: ${{ steps.collection-gate.outputs.collect }}
          SCHEDULE_GATE_REASON: ${{ steps.collection-gate.outputs.reason }}
          FINALIZE_CYCLE: ${{ false }}
        run: python -m forum_observer.runtime finished
      - name: Preserve complete monitor journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            forum-observer/out/monitor/
            forum-observer/out/runtime-monitor/
            forum-observer/out/runtime.json
            forum-observer/out/status.json
            forum-observer/out/collection-error.json
          if-no-files-found: warn

  forum-286-retrospective:
    # Explicit one-off run only. Never called by manual collection or freeze.
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-retro286):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - name: Checkout current collector and preserved frozen baseline
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public forum browser (no OCR)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run collector unit tests
        working-directory: forum-observer
        run: python -m unittest discover -s tests -q
      - name: Crawl all reachable 286 text, comments and score independently
        id: backtest
        working-directory: forum-observer
        continue-on-error: true
        run: |
          python -u -m forum_observer.full_backtest \
            --issue 2026286 --config collector-config.json \
            --out backtest-286 --snapshot archive/issues/2026286/snapshot.json
      - name: Upload isolated historical evidence and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-286-exhaustive-text-backtest
          path: |
            forum-observer/backtest-286/
          retention-days: 30
          if-no-files-found: warn
      - name: Verify independent recognizable-evidence scoring and retain coverage warnings
        if: always()
        working-directory: forum-observer
        run: |
          python -c "import json,pathlib,sys; p=pathlib.Path('backtest-286/comparison.json'); ok=p.is_file() and json.loads(p.read_text()).get('status')=='recognized_valid_evidence_scored'; print('Retrospective complete and comparable:',ok); sys.exit(0 if ok else 2)"

  freeze:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'freeze') || (github.event_name == 'schedule' && (github.event.schedule == '0 13 * * *' || github.event.schedule == '5 13 * * *')) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-freeze):')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: forum-observer-freeze
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze or verify committed snapshot and ledger source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_ISSUE: ${{ inputs.issue }}
          FREEZE_PHASE: ${{ github.event_name != 'schedule' && 'manual' || (github.event.schedule == '5 13 * * *' && 'verify' || 'auto') }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m forum_observer.freeze_operation forum-observer "$FREEZE_PHASE"
