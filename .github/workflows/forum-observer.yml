name: Forum observer daily cycle
on:
  workflow_dispatch:
  # GPT push remains primary. Scheduled retries use Asia/Shanghai time (UTC+8).
  # Each run passes the existing immutable-snapshot and 20:25 cutoff gates.
  schedule:
    - cron: '40,45,50 11 * * *'
    - cron: '0 12 * * *'
  # ChatGPT task writes a daily marker to an isolated trigger branch.
  # Always check out main for collection; trigger files never enter main.
  push:
    branches: [forum-gpt-trigger]
    paths:
      - 'forum-observer/triggers/**'
permissions:
  contents: write
concurrency:
  group: forum-observer-archive
  cancel-in-progress: false
defaults:
  run:
    working-directory: forum-observer
jobs:
  forum-cycle:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'trigger(forum-retro286):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide current-issue collection
        id: collection-gate
        # Scheduled backup, GPT collect marker, or manual dispatch may enter; snapshot gate prevents re-freezing.
        # Audit/settlement/reconciliation triggers must never collect new evidence.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'trigger(forum):') || startsWith(github.event.head_commit.message, 'trigger(forum-collect):')))
        run: python -m forum_observer.schedule --archive archive --github-output "$GITHUB_OUTPUT"
      - name: Install text collector
        if: steps.collection-gate.outputs.collect == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/cache/restore@v4
        with:
          path: |
            forum-observer/.image-cache/
          key: forum-images-${{ runner.os }}-${{ github.run_id }}
          restore-keys: forum-images-${{ runner.os }}-
      - name: Observe current issue
        # GPT/manual triggers are idempotent; never rescan a frozen issue.
        if: steps.collection-gate.outputs.collect == 'true'
        id: observe
        continue-on-error: true
        timeout-minutes: 35
        run: python -u -m forum_observer.auto --config collector-config.json --out out --max-collection-seconds ${{ steps.collection-gate.outputs.max_seconds }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            forum-observer/.image-cache/
          key: forum-images-${{ runner.os }}-${{ github.run_id }}
      - name: Ensure nightly issue report even if collection produced no data
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-audit):')
        run: python -m forum_observer.schedule --archive archive --ensure-report
      - name: Cycle snapshots and settlements from verified V7 history
        run: python -m forum_observer.cycle --out out --archive archive --history ../site/data/history.json --public ../site/data/forum-observer
      - name: Record author history from verified frozen evidence only
        # Separate append-only author memory; no scraping, score updates or frozen edits.
        run: python -m forum_observer.author_profiles --archive archive
      - name: Archive independent forum data only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/ ../site/data/forum-observer/
          if git diff --cached --quiet; then
            echo "No forum archive changes"
            exit 0
          fi
          git commit -m "chore(forum): archive independent observer cycle"
          for attempt in 1 2 3; do
            git fetch origin main
            # Old runs must never rebase a stale collector's archive onto
            # a newer parser/rule revision, especially frozen predictions.
            # Workflow-only changes are not scoring-rule changes and must not
            # silently discard a generated incomplete-status report.
            if ! git -C .. diff --quiet HEAD origin/main -- \
                 forum-observer/forum_observer/ \
                 forum-observer/collector-config.json; then
              echo "A newer collector revision exists on main; skip stale archive publication."
              exit 0
            fi
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - name: Audit immutable current-issue snapshot (GPT audit only)
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-audit):')
        run: python -m forum_observer.schedule --archive archive --require-snapshot
      - name: Publish independent monitor status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVE_OUTCOME: ${{ steps.observe.outcome }}
          GATE_COLLECT: ${{ steps.collection-gate.outputs.collect }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, datetime, base64, urllib.request, urllib.error
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          status_path=pathlib.Path('out/status.json')
          data={}
          if status_path.exists():
              try: data=json.loads(status_path.read_text())
              except Exception: pass
          outcome=os.environ.get('OBSERVE_OUTCOME','')
          job=os.environ.get('JOB_STATUS','')
          state='failed' if job=='failure' or outcome=='failure' else ('completed' if outcome=='success' else 'skipped')
          report={'schema_version':1,'state':state,'issue':data.get('issue'),'run_id':os.environ.get('GITHUB_RUN_ID'),'run_url':f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",'updated_at':now,'successful_post_opens':data.get('successful_post_opens'),'valid_materials':data.get('valid_materials'),'valid_authors':data.get('valid_authors'),'error':None if state=='completed' else ('Collection failed or a preceding step failed' if state=='failed' else 'Collection skipped by schedule or freeze gate')}
          repo=os.environ['GITHUB_REPOSITORY']; url=f'https://api.github.com/repos/{repo}/contents/forum-observer/status/latest.json'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          for attempt in range(3):
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=15) as resp: old=json.load(resp)
                  old_content=json.loads(base64.b64decode(old['content']).decode())
                  if old_content.get('updated_at') and old_content['updated_at']>now:
                      print('Newer monitor state exists; skip stale update'); break
                  payload={'message':'chore(forum): update runtime monitor','branch':'main','sha':old['sha'],'content':base64.b64encode((json.dumps(report,ensure_ascii=False,indent=2)+'\\n').encode()).decode()}
                  req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers=headers,method='PUT')
                  with urllib.request.urlopen(req,timeout=20) as resp: print('Monitor updated:',resp.status)
                  break
              except Exception as exc:
                  print('Monitor update attempt',attempt+1,'failed:',repr(exc))
          PY
      - name: Report status
        if: always()
        shell: bash
        run: |
          if [ -f out/status.json ]; then
            python -c "import json; a=json.load(open('out/status.json')); print({k:a.get(k) for k in ('issue','status','raw_count','top6','audit','author_selection')})"
          fi
          if [ -f archive/summary.json ]; then cat archive/summary.json; fi
          if [ -f out/collection-error.json ]; then cat out/collection-error.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-observer-status
          path: |
            forum-observer/out/
            forum-observer/archive/latest.json
            forum-observer/archive/summary.json
            site/data/forum-observer/latest.json
            site/data/forum-observer/history.json
          if-no-files-found: ignore
      - name: Enforce collection quality
        # GPT/manual collection is verified only when Observe actually ran.
        if: always() && steps.observe.outcome != 'skipped'
        shell: bash
        run: |
          if [ -f out/status.json ]; then
            python -c "import json,sys,pathlib; a=json.load(open('out/status.json')); f=pathlib.Path('archive/issues')/str(a.get('issue',''))/'snapshot.json'; p=pathlib.Path('archive/issues')/str(a.get('issue',''))/'report.md'; ok=f.is_file() and p.is_file(); print('Frozen nightly report:',f,'valid_materials:',a.get('valid_materials',0),'minimum:',a.get('author_selection',{}).get('min_valid_materials',25));sys.exit(0 if ok else 2)"
          else
            echo "No collector status"; exit 2
          fi

  forum-286-retrospective:
    # Explicit one-off run only. Never called by the 19:40/20:30 schedule.
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'trigger(forum-retro286):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - name: Checkout current collector and preserved frozen baseline
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public forum browser (no OCR)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run collector unit tests
        working-directory: forum-observer
        run: python -m unittest discover -s tests -q
      - name: Crawl all reachable 286 text, comments and score independently
        id: backtest
        working-directory: forum-observer
        continue-on-error: true
        run: |
          python -u -m forum_observer.full_backtest \
            --issue 2026286 --config collector-config.json \
            --out backtest-286 --snapshot archive/issues/2026286/snapshot.json
      - name: Upload isolated historical evidence and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-286-exhaustive-text-backtest
          path: |
            forum-observer/backtest-286/
          retention-days: 30
          if-no-files-found: warn
      - name: Verify independent recognizable-evidence scoring and retain coverage warnings
        if: always()
        working-directory: forum-observer
        run: |
          python -c "import json,pathlib,sys; p=pathlib.Path('backtest-286/comparison.json'); ok=p.is_file() and json.loads(p.read_text()).get('status')=='recognized_valid_evidence_scored'; print('Retrospective complete and comparable:',ok); sys.exit(0 if ok else 2)"
