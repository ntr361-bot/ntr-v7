name: Forum source probe (read-only)
# Manual only. Checks whether a candidate site runs the same forum platform as
# the current source. Never scores, freezes, archives, publishes or pushes:
# permissions are read-only and all output goes to an uploaded artifact.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Candidate forum URL (https)
        required: true
        default: https://49217.com/#/forum
      category:
        description: Category filter for the 5-post trial (same as collector-config)
        required: false
        default: 澳门
      max_posts:
        description: Stage 2 trial size (1-100 posts)
        required: false
        default: '5'
      test_issue:
        description: TEST BRANCH ONLY - run 49论坛模型 scoped collection for this issue (no commit, no freeze)
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: forum-source-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: forum-observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe unit tests
        run: python -m unittest tests.test_source_probe -v
      - name: Stage 1 - render page and compare platform structure
        id: stage1
        env:
          PROBE_URL: ${{ inputs.url }}
        run: |
          python -u -m forum_observer.source_probe --url "$PROBE_URL" --out probe-out
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          v=json.load(open('probe-out/probe-summary.json'))['verdict']
          print('match=' + ('true' if v['platform_match'] else 'false'))
          PY
      - name: TEST - 49论坛模型 scoped collection (no commit, no freeze)
        if: inputs.test_issue != ''
        timeout-minutes: 40
        env:
          TEST_ISSUE: ${{ inputs.test_issue }}
        run: |
          python -u - <<'PY'
          import json, os
          from pathlib import Path
          from forum_observer import forum49
          from datetime import datetime
          from zoneinfo import ZoneInfo
          def esc(x): return x.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          # Read-only test: output stays in the runner (contents: read), nothing is committed.
          rec=forum49.run(forum49.DEFAULT_URL, None if os.environ['TEST_ISSUE']=='latest' else os.environ['TEST_ISSUE'], '澳门',
                          Path('test-out'), Path('test-archive'))
          assert not list(Path('test-archive').rglob('snapshot.json'))
          head={k:rec.get(k) for k in ('ok','error','issue','issue_matches_request','detail_posts',
                'nonempty_article_posts','valid_materials','distinct_valid_authors','material_counts',
                'elapsed_seconds','collection_scope')}
          head['top12']=[[r['zodiac'],r['score']] for r in rec.get('ranking_observation') or []]
          print('::notice title=TEST scoped summary::'+esc(json.dumps(head,ensure_ascii=False)[:3800]))
          obs=json.loads((Path('test-out')/str(rec.get('issue'))/'observation.json').read_text()) if (Path('test-out')/str(rec.get('issue'))/'observation.json').exists() else {}
          au=obs.get('audit') or {}
          print('::notice title=TEST scoped featured::'+esc(json.dumps({k:au.get(k) for k in (
                'featured_found_threads','featured_selected_threads','featured_completed_threads',
                'featured_valid_materials','ordinary_valid_materials','priority_audit')},ensure_ascii=False)[:3800]))
          counted=[f"{m['author']}|{m['play']}|{''.join(m['picks'] or [])}" for m in rec.get('materials',[]) if m['counted']]
          for i in range(0,min(len(counted),180),60):
              print(f'::notice title=TEST scoped materials {i//60+1}::'+esc('\n'.join(counted[i:i+60])[:3800]))
          rp=Path('test-out')/str(rec.get('issue'))/'report.md'
          if rp.exists():
              lines=[l for l in rp.read_text().splitlines() if any(w in l for w in ('加精','普通','有效','覆盖'))]
              print('::notice title=TEST report lines::'+esc('\n'.join(lines)[:3800]))
          print('::notice title=TEST excluded::'+esc(json.dumps(rec.get('excluded_reasons'),ensure_ascii=False)[:3800]))
          PY
      - name: Stage 2 - existing collector trial (isolated, no freeze)
        if: steps.stage1.outputs.match == 'true'
        env:
          PROBE_URL: ${{ inputs.url }}
          PROBE_CATEGORY: ${{ inputs.category }}
          PROBE_MAX_POSTS: ${{ inputs.max_posts }}
        run: |
          python -u - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib.parse import urlparse
          from forum_observer import page_collector
          url=os.environ['PROBE_URL']
          # Widen the host allowlist for this process only; the repo file is unchanged.
          page_collector.HOSTS.add(urlparse(url).hostname)
          # TEST BRANCH ONLY: use 49论坛模型's featured ('精') detector, as forum49.run does.
          from forum_observer.forum49 import FEATURED_ICON_SELECTOR
          page_collector.FEATURED_ICON_SELECTORS.append(FEATURED_ICON_SELECTOR)
          cfg=json.loads(Path('collector-config.json').read_text())
          n=max(1,min(int(os.environ.get('PROBE_MAX_POSTS') or 5),100))
          cfg.update(max_posts=n,max_pages=max(5,n//4),max_collection_seconds=1200,
                     daily_profile_authors=0,freeze_enabled=False)
          out=Path('probe-out/collect')
          start=time.monotonic()
          summary={'url':url,'scored_for_ranking':False,'frozen':False,'published':False}
          try:
              result=page_collector.collect_page(url,out,None,os.environ.get('PROBE_CATEGORY') or None,cfg)
              posts=result['evidence']
              summary.update(ok=True,issue=result['issue'],
                  elapsed_seconds=round(time.monotonic()-start,1),
                  detail_posts=len(posts),
                  nonempty_article_posts=sum(bool(p['body'].strip()) for p in posts),
                  parser_valid_materials=result['valid_materials'],
                  distinct_valid_authors=result['distinct_valid_authors'],
                  rejected=result['rejected'][:20],
                  requested_posts=n,
                  material_counts=result.get('material_counts'),
                  featured={k:result.get(k) for k in ('featured_found_threads','featured_selected_threads',
                      'featured_attempted_threads','featured_completed_threads','featured_valid_materials',
                      'ordinary_valid_materials')},
                  featured_posts=[f"{p['author']}|{p['title'][:20]}|{len(p['body'])}字" for p in posts if p.get('is_featured') is True][:40],
                  priority_audit=(result.get('audit') or {}).get('priority_audit'),
                  ranking_preview_test_only=[[r['zodiac'],round(r.get('score',0),3)] for r in (result.get('ranking') or [])[:12]],
                  materials=[{'author':m['author'],'play':m.get('play'),'mode':m.get('mode'),
                              'picks':m.get('picks'),'counted':m['counted_for_ranking'],
                              'reason':m.get('exclusion_reason')} for m in result.get('parsed_predictions') or []],
                  posts=[{'author':p['author'],'title':p['title'],'url':p['detail_url'],
                          'body_chars':len(p['body']),'excerpt':p['body'][:180]} for p in posts])
          except Exception as exc:
              summary.update(ok=False,error=f'{type(exc).__name__}: {exc}'[:800],
                             elapsed_seconds=round(time.monotonic()-start,1))
          assert not list(out.rglob('snapshot.json')), 'probe must never create a snapshot'
          Path('probe-out/collect-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print('COLLECT_SUMMARY '+json.dumps(summary,ensure_ascii=False))
          PY
      - name: Report verdict
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines=['## Forum source probe']
          p=Path('probe-out/probe-summary.json')
          if p.exists():
              s=json.loads(p.read_text())
              v=s['verdict']
              lines+=[f"- URL: {s['url']}", f"- final URL: {s.get('final_url')}",
                      f"- HTTP: {s.get('http_status')} title: {s.get('title')}",
                      f"- tabs: {s.get('tabs')[:12]}", f"- cards: {s.get('card_count')}",
                      f"- platform match: **{v['platform_match']}** reasons: {v['reasons']}",
                      f"- authors seen: {v['distinct_authors']} issues: {v['issues_seen']}"]
          else:
              lines.append('- stage 1 produced no summary (see log)')
          c=Path('probe-out/collect-summary.json')
          if c.exists():
              s=json.loads(c.read_text())
              lines+=[f"- stage 2 ok: {s.get('ok')} issue: {s.get('issue')} posts: {s.get('detail_posts')} "
                      f"parser-valid: {s.get('parser_valid_materials')} error: {s.get('error')}"]
          lines.append('- scored / frozen / published: none (probe only)')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n')
          # Also emit as annotations so the verdict is readable via the checks API
          # without downloading logs or artifacts.
          def esc(x): return x.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=probe verdict::'+esc('\n'.join(lines)))
          c0=Path('probe-out/collect-summary.json')
          if c0.exists():
              cs=json.loads(c0.read_text())
              print('::notice title=probe featured collect::'+esc(json.dumps({'featured':cs.get('featured'),
                  'featured_posts':cs.get('featured_posts'),'priority_audit':cs.get('priority_audit')},ensure_ascii=False)[:3800]))
          if p.exists():
              s=json.loads(p.read_text())
              detail={k:s.get(k) for k in ('final_url','http_status','title','navigation_error','listing_error')}
              detail['body_preview']=(s.get('body_preview') or '')[:1500]
              detail['cards']=s.get('cards',[])[:6]
              detail['request_failures']=s.get('request_failures',[])[:8]
              detail['console_errors']=s.get('console_errors',[])[:5]
              print('::notice title=probe detail::'+esc(json.dumps(detail,ensure_ascii=False)[:30000]))
              fm=s.get('featured_markup')
              if fm or s.get('featured_markup_error'):
                  head={'error':s.get('featured_markup_error'),
                        'cards_seen':(fm or {}).get('cards_seen'),
                        'article_keys':(fm or {}).get('article_keys'),
                        'stats':(fm or {}).get('stats')}
                  print('::notice title=probe featured keys::'+esc(json.dumps(head,ensure_ascii=False)[:3800]))
                  for kind in ('featured','ordinary'):
                      for i,row in enumerate((fm or {}).get(kind) or []):
                          print(f'::notice title=probe {kind} {i+1}::'+esc(json.dumps(row,ensure_ascii=False)[:3800]))
          if c.exists():
              cs=json.loads(c.read_text())
              from collections import Counter
              mats=cs.get('materials',[])
              print('::notice title=probe materials::'+esc(json.dumps({
                  'requested':cs.get('requested_posts'),'detail_posts':cs.get('detail_posts'),
                  'nonempty':cs.get('nonempty_article_posts'),
                  'valid':cs.get('parser_valid_materials'),'valid_authors':cs.get('distinct_valid_authors'),
                  'material_counts':cs.get('material_counts'),
                  'counted':[f"{m['author']}|{m['play']}|{''.join(m['picks'] or [])}" for m in mats if m['counted']][:40],
                  'excluded_reasons':Counter(str(m['reason'])[:40] for m in mats if not m['counted']).most_common(10),
                  'ranking_preview_test_only':cs.get('ranking_preview_test_only')},ensure_ascii=False)[:3800]))
              brief={'issue':cs.get('issue'),'error':cs.get('error'),
                     'posts':[{'author':x['author'],'url':x['url'][-40:],'chars':x['body_chars'],'excerpt':x['excerpt'][:90]} for x in cs.get('posts',[])],
                     'rejected':[json.dumps(r,ensure_ascii=False)[:160] for r in cs.get('rejected',[])[:8]]}
              print('::notice title=probe stage2::'+esc(json.dumps(brief,ensure_ascii=False)[:3800]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-source-probe
          path: forum-observer/probe-out/
