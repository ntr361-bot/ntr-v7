name: Forum article-only 10-post validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/forum-article-only-test.yml', 'forum-observer/forum_observer/page_collector.py', 'forum-observer/tests/test_article_detail_recovery.py']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/forum-article-only-test.yml', 'forum-observer/forum_observer/page_collector.py', 'forum-observer/tests/test_article_detail_recovery.py']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forum-observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Regression tests (no formal V7 or snapshot writes)
        run: python -m unittest discover -s tests -v
      - name: Probe dynamic card identities (read-only)
        run: |
          python -u - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          url=json.loads(Path('collector-config.json').read_text())['forum_url']
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True,args=['--no-sandbox'])
              try:
                  page=browser.new_page(viewport={'width':1280,'height':1800})
                  page.goto(url,wait_until='domcontentloaded',timeout=60000)
                  page.get_by_role('tab',name='澳彩',exact=True).click(timeout=15000)
                  page.get_by_text('最新',exact=True).click(timeout=15000)
                  page.wait_for_timeout(900)
                  cards=page.locator('.forum-list > li').evaluate_all("""nodes=>nodes.slice(0,8).map(li=>({
                    title:li.querySelector('.formtitle')?.innerText?.trim(),
                    author:li.querySelector('.name')?.innerText?.trim(),
                    hrefs:[...li.querySelectorAll('a')].map(x=>x.href),
                    data:li.dataset,
                    html:li.outerHTML.slice(0,2200)
                  }))""")
                  print('CARD_DOM_PROBE '+json.dumps(cards,ensure_ascii=False))
                  state=page.locator('.forum-list > li').first.evaluate("""li=>{
                    const output=[];
                    for(let el=li,depth=0;el&&depth<12;el=el.parentElement,depth++){
                      const vm=el.__vue__;
                      if(!vm)continue;
                      const data=vm.$data||{};
                      const props=vm.$props||{};
                      const candidates=Object.entries(data)
                        .filter(([k,v])=>/list|data|post|forum|article|item/i.test(k))
                        .map(([k,v])=>({key:k,value:JSON.stringify(v)?.slice(0,1800)}));
                      output.push({depth,tag:el.tagName,vmKeys:Object.keys(data),
                        propKeys:Object.keys(props),candidates});
                    }
                    return output;
                  }""")
                  print('VUE_CARD_PROBE '+json.dumps(state,ensure_ascii=False)[:13000])
                  data=page.locator('.forum-list > li').first.evaluate("""li=>{
                    let el=li;
                    while(el && !Array.isArray(el.__vue__?.$data?.list))el=el.parentElement;
                    const arr=el?.__vue__?.$data?.list||[];
                    return {length:arr.length,fields:Object.keys(arr[0]||{}),
                      rows:arr.slice(0,12).map(x=>({
                        id:x.articleId,issue:x.periodStr,title:x.title,
                        description:String(x.description||'').slice(0,60),
                        author:x.memberName||x.userName||x.nickName||x.nickname||'',
                        sampleKeys:Object.keys(x).filter(k=>/name|user|title|member|period|article|type/i.test(k))
                      }))};
                  }""")
                  print('ARTICLE_ID_PROBE '+json.dumps(data,ensure_ascii=False)[:11000])

                  if cards:
                      page.locator('.forum-list > li .formtitle').first.click(timeout=2500)
                      page.wait_for_timeout(1600)
                      print('CARD_NAV_PROBE '+json.dumps({'url':page.url,
                          'text':page.locator('body').inner_text(timeout=2000)[:1200]},ensure_ascii=False))
              finally:browser.close()
          PY
      - name: Collect ten article details and verify isolation
        run: |
          python -u - <<'PY'
          import json,time
          from pathlib import Path
          from forum_observer.page_collector import collect_page
          cfg=json.loads(Path('collector-config.json').read_text())
          cfg.update(max_posts=10,max_pages=5,max_collection_seconds=600,daily_profile_authors=0,freeze_enabled=False)
          start=time.monotonic()
          out=Path('article-only-test')
          result=collect_page(cfg['forum_url'],out,None,cfg.get('category'),cfg)
          posts=result['evidence']
          summary={
              'issue':result['issue'],
              'elapsed_seconds':round(time.monotonic()-start,1),
              'requested_posts':10,
              'detail_posts':len(posts),
              'nonempty_article_posts':sum(bool(p['body'].strip()) for p in posts),
              'valid_materials':result['valid_materials'],
              'distinct_valid_authors':result['distinct_valid_authors'],
              'comment_records':result['comment_records'],
              'comment_attempted_threads':result['comment_attempted_threads'],
              'errors':result['rejected'],
              'posts':[{'author':p['author'],'title':p['title'],'url':p['detail_url'],'body_chars':len(p['body']),'excerpt':p['body'][:180],'comments':p['comments'],'detail_coverage':p.get('detail_coverage')} for p in posts],
              'frozen':False,'published':False
          }
          print('VALIDATION_SUMMARY '+json.dumps(summary,ensure_ascii=False))
          def esc(x): return x.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          brief={k:summary[k] for k in summary if k!='posts'}
          brief['posts']=[{k:p[k] for k in ('author','body_chars','detail_coverage')} for p in summary['posts']]
          # Logs cannot always be downloaded; keep the outcome readable via the checks API.
          print('::notice title=article-only summary::'+esc(json.dumps(brief,ensure_ascii=False)[:3800]))
          try:
              # A live post may be image-only: its detail page opens and is verified, but
              # has no text (article-only rule). Count it as opened, never as evidence.
              empty=[e for e in result['rejected'] if e.get('reason')=='verified detail has no extractable article text'
                     and (e.get('detail_diagnostic') or {}).get('verification')=='verified']
              assert len(posts)+len(empty)==10, f'Only {len(posts)}+{len(empty)} of 10 article details verified'
              assert len(posts)>=5, f'Only {len(posts)} of 10 verified details had article text'
              assert all(p['body'].strip() and p.get('detail_coverage')=='verified_article_text' for p in posts), 'Missing verified article text'
              assert all(p['comments']=='' and not p.get('images') and p.get('evidence_scope')=='post_article' for p in posts)
              assert all(not any(q['author']!=p['author'] and '\n'+q['author']+'\n' in p['body'] for q in posts) for p in posts), 'Article text includes other forum authors (feed contamination)'
              assert result['comment_records']==0 and result['comment_attempted_threads']==0
              assert not result['completed_thread_cache']
              assert not list(out.rglob('snapshot.json'))
          except AssertionError as exc:
              print('::error title=article-only assertion::'+esc(str(exc) or 'assertion failed'))
              raise
          print('ARTICLE_ONLY_VALIDATION_PASSED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-article-only-10-post-test
          path: forum-observer/article-only-test/
