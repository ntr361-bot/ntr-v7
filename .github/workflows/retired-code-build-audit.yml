name: Temporary retired-code build audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retired-code-build-audit.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore PredictionRunner/PredictionRunner.csproj
      - run: dotnet build PredictionRunner/PredictionRunner.csproj --configuration Release --no-restore
