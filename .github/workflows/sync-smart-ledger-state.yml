name: Sync V7 State to Smart Ledger

on:
  workflow_dispatch:
  schedule:
    - cron: "45 * * * *"
  workflow_run:
    workflows: ["Run V7 Isolated Prediction"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-smart-ledger-state.yml"

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: v7-isolated-prediction-generation
  cancel-in-progress: false

jobs:
  recover-formal-prediction:
    # GitHub scheduled events can be delayed or omitted. The hourly sync job
    # checks the two formal-prediction windows and dispatches one recovery run
    # only when no successful or active run exists for today's cycle.
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Recover missing formal prediction run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now_beijing="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          hour="${now_beijing:11:2}"
          minute="${now_beijing:14:2}"
          if [[ "$hour" != "22" && "$hour" != "23" ]]; then
            echo "Outside formal-prediction recovery window: $now_beijing"
            exit 0
          fi

          today_utc="$(TZ=UTC date '+%Y-%m-%d')"
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&created=${today_utc}T00:00:00Z..$(TZ=UTC date -d '+1 day' '+%Y-%m-%d')T00:00:00Z" --jq '[.workflow_runs[] | select(.path == ".github/workflows/run-prediction.yml" and (.event == "schedule" or .event == "workflow_dispatch") and .head_branch == "main")]')"
          active="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
          successful="$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<<"$runs")"

          if (( active > 0 )); then
            echo "A formal prediction run is already active; no recovery dispatch."
            exit 0
          fi
          if (( successful > 0 )); then
            echo "A formal prediction run already completed successfully today; no recovery dispatch."
            exit 0
          fi

          echo "No active or successful formal prediction run found at $now_beijing; dispatching recovery."
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/run-prediction.yml/dispatches" \
            -f ref=main \
            -f 'inputs[retry_attempt]=hourly-recovery' \
            -f 'inputs[refresh_data]=true' \
            -f 'inputs[dry_run]=false'
          echo "Formal prediction recovery dispatched."

  sync:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main') }}
    runs-on: windows-latest
    steps:
      - name: Checkout current committed state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate committed snapshot (no models, no writes)
        run: python scripts/pipeline_guard.py validate

      # The old ChatGPT Sites ledger is read-only since 2026-10-23 (user
      # request): nothing is published to it any more. The self-hosted ledger
      # reads the committed site/data from this repository directly.

      - name: Report synchronization failure
        if: ${{ failure() }}
        shell: pwsh
        run: |
          Write-Host '::error::Committed prediction synchronization failed; no formal model was run. Next hourly synchronization retries this snapshot.'
          'Committed-state publish failed. See logs; no prediction was regenerated.' >> $env:GITHUB_STEP_SUMMARY

  forum-settle:
    # Reuse the formal models' draw-history/update cycle. This is an independent
    # downstream consumer; it never runs a prediction model or edits V7 files.
    # It also runs when formal ledger transport fails, as long as verified
    # history has actually been committed to main.
    needs: sync
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: forum-observer-archive
      cancel-in-progress: false
    steps:
      - name: Checkout verified committed draw history
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Settle forum snapshots using authenticated read-only ledger results
        working-directory: forum-observer
        shell: bash
        env:
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
        run: |
          set -euo pipefail
          # The smart-ledger site is access-protected. Read it using the exact
          # OIDC/bypass mechanism already used by the formal V7 sync.
          if [ -n "${SITES_SIWC_BYPASS_TOKEN:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            if TOKEN_RESPONSE="$(curl -fsS --max-time 12 \
                -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=smart-ledger-v7")"; then
              export FORUM_LEDGER_AUTH_BEARER="$(printf '%s' "$TOKEN_RESPONSE" |
                python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
            else
              echo "Could not obtain read-only ledger authorization; fallback to committed draw history."
            fi
          fi
          python -m forum_observer.cycle --out out --archive archive \
            --history ../site/data/history.json --public ../site/data/forum-observer \
            --ledger-live-results https://smart-ledger-2026.ntr133.chatgpt.site/api/results

      - name: Commit only independently namespaced forum settlements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forum-observer/archive/ site/data/forum-observer/
          if git diff --cached --quiet; then
            echo "No new verified forum settlement; no commit needed."
            exit 0
          fi
          git commit -m "chore(forum): settle from formal verified draw history"
          # Fail closed on a concurrent commit; the existing hourly sync
          # will retry from a fresh main rather than rebasing stale snapshots.
          if ! git push origin HEAD:main; then
            echo "::error::main advanced; forum settlement left unpushed for a fresh retry"
            exit 1
          fi
