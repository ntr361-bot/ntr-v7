name: Sync V7 State to Smart Ledger

on:
  workflow_dispatch:
  schedule:
    - cron: "45 * * * *"
  workflow_run:
    workflows: ["Run V7 Isolated Prediction"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-smart-ledger-state.yml"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: v7-isolated-prediction-generation
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main') }}
    runs-on: windows-latest
    steps:
      - name: Checkout current committed state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate committed snapshot (no models, no writes)
        run: python scripts/pipeline_guard.py validate

      - name: Publish current V7 state to smart ledger
        shell: pwsh
        run: |
          function Invoke-RequiredPublish {
            param([string]$Url, [hashtable]$Headers, [string]$Body)
            $lastError = $null
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                $response = Invoke-RestMethod -Method Post -Uri $Url -Headers $Headers -ContentType 'application/json' -Body $Body -ErrorAction Stop
                if ($null -ne $response.status -and $response.status -ne 'success') {
                  throw "发布接口返回异常状态：$($response.status)"
                }
                return $response
              } catch {
                $lastError = $_
                if ($attempt -eq 3 -and $_.ErrorDetails.Message) {
                  # Print only the site's bounded JSON error body, never headers or bearer tokens.
                  $reason = [string]$_.ErrorDetails.Message
                  Write-Warning ("V7 sync API response: " + $reason.Substring(0, [Math]::Min(800, $reason.Length)))
                }
                if ($attempt -lt 3) { Start-Sleep -Seconds (3 * $attempt) }
              }
            }
            throw "发布失败：$($lastError.Exception.Message)"
          }

          # Hourly checks are useful recovery points, but an already verified
          # snapshot at the same commit does not need another full-archive POST.
          # If the latest live read-back fails, fall through and republish below.
          $sameRevisionPublished = $false
          if ($env:GITHUB_EVENT_NAME -eq 'schedule') {
            try {
              $runsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/sync-smart-ledger-state.yml/runs?status=success&per_page=20"
              $runs = Invoke-RestMethod -Method Get -Uri $runsUri -Headers @{
                Authorization = "Bearer $env:GITHUB_TOKEN"
                Accept = 'application/vnd.github+json'
                'X-GitHub-Api-Version' = '2022-11-28'
              } -ErrorAction Stop
              $sameRevisionPublished = @($runs.workflow_runs | Where-Object { $_.head_sha -eq $env:GITHUB_SHA }).Count -gt 0
            } catch {
              Write-Warning "Could not verify prior scheduled publication; retrying full publish: $($_.Exception.Message)"
            }
          }

          $tokenUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=smart-ledger-v7"
          $oidc = (Invoke-RestMethod -Uri $tokenUrl -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" } -ErrorAction Stop).value
          if (!$env:SITES_SIWC_BYPASS_TOKEN) { throw 'Missing SITES_SIWC_BYPASS_TOKEN Actions secret.' }
          $headers = @{
            Authorization = "Bearer $oidc"
            'OAI-Sites-Authorization' = "Bearer $env:SITES_SIWC_BYPASS_TOKEN"
          }

          if ($sameRevisionPublished) {
            try {
              $checkManifest = Get-Content 'site/data/daily-records/manifest.json' -Raw | ConvertFrom-Json
              $checkIssue = [int]$checkManifest.latest_issue
              $checkFile = "$checkIssue.json"
              $liveCheckManifest = Invoke-RestMethod -Uri 'https://smart-ledger-2026.ntr133.chatgpt.site/api/v7-sync/manifest' -Headers $headers -ErrorAction Stop
              $liveCheckForecast = Invoke-RestMethod -Uri "https://smart-ledger-2026.ntr133.chatgpt.site/api/v7-sync/prediction?file=$checkFile" -Headers $headers -ErrorAction Stop
              if ([int]$liveCheckManifest.latest_issue -eq $checkIssue -and
                  @($liveCheckManifest.records) -contains $checkFile -and
                  [int]$liveCheckForecast.issue -eq $checkIssue -and $liveCheckForecast.status -eq 'success') {
                Write-Host "No V7 source changes since verified publication at $env:GITHUB_SHA; skipped full archive publish."
                'No committed V7 changes; live manifest and latest forecast read-back passed, so the full archive publish was skipped.' >> $env:GITHUB_STEP_SUMMARY
                exit 0
              }
              Write-Warning 'Prior publication read-back differs from the committed latest issue; retrying full publish.'
            } catch {
              Write-Warning "Prior publication read-back failed; retrying full publish: $($_.Exception.Message)"
            }
          }

          $manifest = Get-Content 'site/data/daily-records/manifest.json' -Raw | ConvertFrom-Json
          $predictions = @{}
          foreach ($file in $manifest.records) {
            $predictions[$file] = Get-Content "site/data/daily-records/$file" -Raw | ConvertFrom-Json
          }

          $modelState = Get-Content 'site/data/runtime-state.json' -Raw | ConvertFrom-Json
          # Temporary wire compatibility for the old deployed ledger guard.
          # Its stored frozen 285 rows say "本地生成"; the repository now says
          # "云端同步". Preserve the original provenance ONLY in the outgoing
          # transport payload. Committed forecasts and settlement stay unchanged.
          $legacy285 = @($modelState.predictions | Where-Object {
            [string]$_.issue -eq '2026285' -and [string]$_.predictionSource -eq '云端同步'
          })
          if ($legacy285.Count -gt 0) {
            if ($legacy285.Count -ne 6) { throw 'Unexpected partial 285 provenance migration; refusing to publish.' }
            foreach ($row in $legacy285) { $row.predictionSource = '本地生成' }
            Write-Host 'Applied legacy 285 provenance compatibility in memory (six rows; no forecast changes).'
          }
          $payload = @{
            history = Get-Content 'site/data/history.json' -Raw | ConvertFrom-Json
            dailyHistory = Get-Content 'site/data/daily-records/history.json' -Raw | ConvertFrom-Json
            manifest = $manifest
            modelState = $modelState
            predictions = $predictions
          } | ConvertTo-Json -Depth 100 -Compress

          $response = Invoke-RequiredPublish -Url 'https://smart-ledger-2026.ntr133.chatgpt.site/api/v7-sync/publish' -Headers $headers -Body $payload
          Write-Host "Smart ledger sync status: $($response.status)"
          # Read-only production verification: reject "success" if latest files are not actually served.
          $expectedIssue = [int]$manifest.latest_issue
          $latestFile = "$expectedIssue.json"
          $liveManifest = Invoke-RestMethod -Uri 'https://smart-ledger-2026.ntr133.chatgpt.site/api/v7-sync/manifest' -Headers $headers -ErrorAction Stop
          if ([int]$liveManifest.latest_issue -ne $expectedIssue -or @($liveManifest.records) -notcontains $latestFile) {
            throw "Live manifest read-back does not contain $latestFile"
          }
          $liveForecast = Invoke-RestMethod -Uri "https://smart-ledger-2026.ntr133.chatgpt.site/api/v7-sync/prediction?file=$latestFile" -Headers $headers -ErrorAction Stop
          if ([int]$liveForecast.issue -ne $expectedIssue -or $liveForecast.status -ne 'success') {
            throw "Live forecast read-back is not the committed $latestFile"
          }
          Write-Host "Read-back verified: live manifest and frozen forecast $latestFile"

        env:
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Report synchronization failure
        if: ${{ failure() }}
        shell: pwsh
        run: |
          Write-Host '::error::Committed prediction synchronization failed; no formal model was run. Next hourly synchronization retries this snapshot.'
          'Committed-state publish failed. See logs; no prediction was regenerated.' >> $env:GITHUB_STEP_SUMMARY

  forum-settle:
    # Reuse the formal models' draw-history/update cycle. This is an independent
    # downstream consumer; it never runs a prediction model or edits V7 files.
    # It also runs when formal ledger transport fails, as long as verified
    # history has actually been committed to main.
    needs: sync
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: forum-observer-archive
      cancel-in-progress: false
    steps:
      - name: Checkout verified committed draw history
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Settle forum snapshots using authenticated read-only ledger results
        working-directory: forum-observer
        shell: bash
        env:
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}
        run: |
          set -euo pipefail
          # The smart-ledger site is access-protected. Read it using the exact
          # OIDC/bypass mechanism already used by the formal V7 sync.
          if [ -n "${SITES_SIWC_BYPASS_TOKEN:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            if TOKEN_RESPONSE="$(curl -fsS --max-time 12 \
                -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=smart-ledger-v7")"; then
              export FORUM_LEDGER_AUTH_BEARER="$(printf '%s' "$TOKEN_RESPONSE" |
                python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
            else
              echo "Could not obtain read-only ledger authorization; fallback to committed draw history."
            fi
          fi
          python -m forum_observer.cycle --out out --archive archive \
            --history ../site/data/history.json --public ../site/data/forum-observer \
            --ledger-live-results https://smart-ledger-2026.ntr133.chatgpt.site/api/results

      - name: Commit only independently namespaced forum settlements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forum-observer/archive/ site/data/forum-observer/
          if git diff --cached --quiet; then
            echo "No new verified forum settlement; no commit needed."
            exit 0
          fi
          git commit -m "chore(forum): settle from formal verified draw history"
          # Fail closed on a concurrent commit; the existing hourly sync
          # will retry from a fresh main rather than rebasing stale snapshots.
          if ! git push origin HEAD:main; then
            echo "::error::main advanced; forum settlement left unpushed for a fresh retry"
            exit 1
          fi
