name: V7 1000-period Signal Ablation

on:
  push:
    branches:
      - validation/1000-walkforward-20260913
    paths:
      - .github/workflows/validate-ablation.yml
      - Tests/AblationRunner/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ablation:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      LIUHE_DATA_DIR: ${{ github.workspace }}\data
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build prediction runner and ablation runner
        shell: pwsh
        run: |
          dotnet restore PredictionRunner/PredictionRunner.csproj
          dotnet build PredictionRunner/PredictionRunner.csproj --configuration Release --no-restore
          dotnet restore Tests/AblationRunner/AblationRunner.csproj
          dotnet build Tests/AblationRunner/AblationRunner.csproj --configuration Release --no-restore

      - name: Rebuild isolated history database
        shell: pwsh
        run: |
          dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- --rebuild-db --rebuild-only

      - name: Run 1000-period signal ablation
        shell: pwsh
        run: |
          dotnet run --project Tests/AblationRunner/AblationRunner.csproj --configuration Release --no-build | Tee-Object -FilePath docs/1000-ablation-console.log

      - name: Commit ablation report to validation branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/1000-ablation-report.json docs/1000-ablation-report.md docs/1000-ablation-console.log
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "test: record 1000-period signal ablation"
          git pull --rebase origin validation/1000-walkforward-20260913
          git push origin HEAD:validation/1000-walkforward-20260913
