name: Desktop Resource Regression

on:
  pull_request:
    paths:
      - 'Form1.cs'
      - 'DatabaseHelper.cs'
      - 'DatabaseBackupService.cs'
      - 'SymmetricRuntimeState.cs'
      - 'Tests/**'
      - '.github/workflows/desktop-resource-smoke.yml'
  push:
    branches:
      - fix/safe-init-idempotency-p25-20261020
    paths:
      - 'Form1.cs'
      - 'DatabaseHelper.cs'
      - 'DatabaseBackupService.cs'
      - 'SymmetricRuntimeState.cs'
      - 'Tests/**'
      - '.github/workflows/desktop-resource-smoke.yml'

permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      LIUHE_DATA_DIR: ${{ runner.temp }}/desktop-resource-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Measure desktop refresh resource growth
        run: dotnet run --project Tests/六合分析软件.SmokeTests.csproj -c Release -- --desktop-resource-smoke
      - name: Run complete isolated regression suite
        run: dotnet run --project Tests/六合分析软件.SmokeTests.csproj -c Release
