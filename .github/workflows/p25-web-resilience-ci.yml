name: P25 Web Resilience CI

on:
  push:
    branches:
      - work/p25-web-resilience-20260915
    paths:
      - "WebsiteLearningService.cs"
      - "Tests/**"
      - ".github/workflows/p25-web-resilience-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Tests/六合分析软件.SmokeTests.csproj
      - run: dotnet build Tests/六合分析软件.SmokeTests.csproj --configuration Release --no-restore
      - run: dotnet run --project Tests/六合分析软件.SmokeTests.csproj --configuration Release --no-build -- --p21-p25-smoke
      - name: Rebuild isolated history database
        shell: pwsh
        run: dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release -- --rebuild-db --rebuild-only
      - name: Exercise real P25 website fetch
        shell: pwsh
        run: dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release -- --force
      - name: Verify real website evidence and successful endpoint
        shell: pwsh
        run: |
          $path = 'site/data/predictions/website-learning-archive.json'
          if (!(Test-Path $path)) { throw 'P25 did not create website-learning-archive.json' }
          $state = Get-Content $path -Raw | ConvertFrom-Json
          $evidence = @($state.Evidence)
          $healthy = @($state.Endpoints | Where-Object { $_.SuccessCount -gt 0 })
          if ($evidence.Count -eq 0) { throw 'P25 fetched no real website evidence' }
          if ($healthy.Count -eq 0) { throw 'P25 found no successful website entry endpoint' }
          Write-Host "P25_LIVE_FETCH_PASS evidence=$($evidence.Count) healthy_endpoints=$($healthy.Count)"
          $healthy | Select-Object Url,SuccessCount,FailureCount,ConsecutiveFailures,LastSuccessAt | Format-Table | Out-Host
