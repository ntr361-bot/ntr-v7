name: Forum author-comment image test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/forum-comment-test.yml"
      - "forum-observer/forum_observer/comment_probe.py"
      - "forum-observer/forum_observer/comment_image_test.py"
      - "forum-observer/forum_observer/comment_collector.py"
permissions:
  contents: read
jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: forum-observer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
      - run: python -m unittest discover -s tests -v
      - run: python -u -m forum_observer.comment_image_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-author-comments-284-test
          path: forum-observer/comment-test-out/
          if-no-files-found: error
