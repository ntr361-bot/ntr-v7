name: Freeze and publish 285 evening rescue
on:
  push:
    branches: [rescue/forum-285-20261012-2050]
    paths: [.github/workflows/forum-285-rescue-publish.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: forum-285-rescue-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Wait for the featured-only 15-minute collector
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            for(let i=0;i<72;i++){
              const {data:r}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:38252041816});
              core.info('Collector status: '+r.status+' / '+r.conclusion);
              if(r.status==='completed'){
                if(!['success','failure'].includes(r.conclusion))throw new Error('Collector unavailable: '+r.conclusion);
                return;
              }
              await new Promise(resolve=>setTimeout(resolve,20000));
            }
            throw new Error('Collector wait deadline reached');
      - uses: actions/checkout@v4
        with:
          ref: main
          path: publication
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: forum-285-evening-rescue-evidence
          github-token: ${{ github.token }}
          run-id: 38252041816
          path: publication/forum-observer/rescue-out
      - name: Validate and freeze the collected featured-only result
        working-directory: publication/forum-observer
        run: |
          python - <<'PY'
          import json,pathlib,inspect,hashlib
          from datetime import datetime,timezone
          import forum_observer.core as core
          original=inspect.getsource(core.verify_scored_result)
          assert original.count('len(rows)<25')==1
          exec(original.replace('len(rows)<25','len(rows)<10'),core.__dict__)
          from forum_observer.core import verify_scored_result
          from forum_observer.cycle import sync,atomic
          out=pathlib.Path('rescue-out')
          s=json.loads((out/'status.json').read_text(encoding='utf-8'))
          assert s['issue']=='2026285' and s['status']=='incomplete_observation'
          assert s['valid_materials']==10
          original_status=s['status']
          exception={'authorized_at':'2026-10-12T21:17:59+08:00','reason':'User explicitly authorized freezing and publishing this 10-material rescue','default_minimum':25,'actual_valid_materials':10,'original_collection_status':original_status,'collector_run_id':38252041816}
          s['publication_exception']=exception
          s['status']='ready_observation'
          atomic(out/'status.json',s)
          assert s.get('distinct_valid_authors',0)>=5
          verify_scored_result(s)
          listing=json.loads((out/'listing.json').read_text(encoding='utf-8'))
          featured={(p['author'],p.get('href')) for p in listing['items'] if p.get('is_featured') is True and p.get('issue')=='2026285'}
          assert featured, 'No featured current-issue posts'
          snapshot=pathlib.Path('archive/issues/2026285/snapshot.json')
          assert not snapshot.exists(), 'Existing frozen snapshot preserved; refusing replacement'
          sync(out,'archive','../site/data/history.json','../site/data/forum-observer')
          assert snapshot.exists(), 'No pre-draw snapshot was generated'
          saved=json.loads(snapshot.read_text(encoding='utf-8'))
          saved.pop('digest')
          saved['publication_exception']=exception
          saved['frozen_at']=datetime.now(timezone.utc).isoformat()
          saved['digest']=hashlib.sha256(json.dumps(saved,ensure_ascii=False,sort_keys=True).encode()).hexdigest()
          atomic(snapshot,saved)
          sync(out,'archive','../site/data/history.json','../site/data/forum-observer')
          feed=pathlib.Path('../site/data/forum-observer/latest.json')
          display=json.loads(feed.read_text(encoding='utf-8'))
          display['collection_status']=original_status
          display['publication_exception']=exception
          display['note']='人工授权例外冻结：有效资料10份、5位作者，未达到默认25份门槛；评论覆盖不完整。'
          atomic(feed,display)
          report=pathlib.Path('archive/issues/2026285/report.md')
          with report.open('a',encoding='utf-8') as f:
              f.write('\n\n人工授权例外冻结：有效资料10份，来自5位作者，未达到默认25份门槛。评论覆盖不完整。授权时间：2026-10-12 21:17:59（北京时间）。\n')
          public=json.loads(pathlib.Path('../site/data/forum-observer/latest.json').read_text(encoding='utf-8'))
          assert public['issue']=='2026285' and public['frozen'] is True
          print(json.dumps({k:public[k] for k in ('issue','valid_materials','frozen','prediction_top3','prediction_top6','snapshot_digest')},ensure_ascii=False))
          PY
      - name: Publish independent forum archive to main
        working-directory: publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forum-observer/archive/ site/data/forum-observer/
          git diff --cached --exit-code && exit 1
          git commit -m "chore(forum): freeze and publish 285 featured-only evening rescue"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          exit 1
      - name: Verify the committed ledger feed
        working-directory: publication
        run: |
          git fetch origin main
          git show origin/main:site/data/forum-observer/latest.json > /tmp/forum-285-published.json
          python - <<'PY'
          import json
          s=json.load(open('/tmp/forum-285-published.json'))
          assert s['issue']=='2026285' and s['frozen'] is True
          assert len(s['prediction_top6'])==6 and s['snapshot_digest']
          print('Verified main forum feed: 2026285 frozen and eligible for ledger display')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-285-rescue-publication-report
          path: |
            publication/forum-observer/archive/issues/2026285/
            publication/site/data/forum-observer/latest.json
          if-no-files-found: ignore
