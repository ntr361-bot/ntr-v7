name: Audit 2026281 forum archive (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/forum-281-audit.yml"
      - "forum-observer/forum_observer/page_collector.py"
      - "forum-observer/tests/test_post_history_isolation.py"
permissions:
  contents: write
jobs:
  historical-281-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: forum-observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser, OCR
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Read historical 281 evidence (no main archive or freeze writes)
        shell: bash
        run: |
          set +e
          python -m forum_observer.auto --config collector-config.json --issue 2026281 --out audit-281
          code=$?
          echo "collector_exit_code=$code" > audit-281-exit.txt
          exit 0
      - name: Verify strict issue separation and report actual counts
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,sys
          out=pathlib.Path('audit-281')
          status=out/'status.json'
          if not status.exists():
              print('AUDIT FAILED: collector generated no status')
              error=out/'collection-error.json'
              if error.exists():print(error.read_text())
              sys.exit(2)
          s=json.loads(status.read_text(encoding='utf-8'))
          row={
            'issue':s.get('issue'),'status':s.get('status'),
            'raw_posts':s.get('raw_count'),'valid_materials':s.get('valid_materials'),
            'candidate_materials':s.get('candidate_materials'),
            'distinct_valid_authors':s.get('distinct_valid_authors'),
            'excluded_materials':s.get('excluded_materials'),
            'detail_errors':len(s.get('audit',{}).get('detail_errors',[])),
            'truncated':s.get('audit',{}).get('truncated'),
            'top6_observation':s.get('top6',[]),
            'retrospective_281_rows':len(s.get('historical_references',[])),
            'next_period_posts_checked':s.get('next_period_posts_checked',0),
          }
          print(json.dumps(row,ensure_ascii=False,indent=2))
          assert s.get('issue')=='2026281','Wrong declared issue'
          evidence=s.get('evidence',[])
          assert all(p.get('issue')=='2026281' for p in evidence),'CROSS-ISSUE LEAK'
          assert s.get('valid_materials',0) <= s.get('candidate_materials',0),'Invalid totals'
          assert s.get('valid_materials',0) == sum(p.get('counted_for_ranking',False) for p in s.get('parsed_predictions',[])),'Count mismatch'
          references=s.get('historical_references',[])
          assert isinstance(references,list),'Invalid retro source array'
          assert s.get('historical_reference_count',0)==len(references),'Retro count mismatch'
          assert all(p.get('issue')=='2026281'
                  and p.get('source_post_issue')=='2026282'
                  and p.get('classification')=='retrospective_after_draw_not_prediction'
                  and p.get('counted_for_ranking') is False
                  and str(p.get('source_url','')).startswith('https://')
                  for p in references),'Retrospective evidence invalid'
          if not evidence and not references:
              raise AssertionError('No original 281 posts and no 281 lines in 282 articles')
          if not evidence:
              print('281: historical 282-post references available; NOT a pre-draw prediction')
          if row['detail_errors']:print('WARNING: some post details were not retrieved')
          if s.get('status')!='ready_observation':print('WARNING: result did not meet full observation gate')
          print('281 direct evidence / retrospective references isolation audit passed')
          PY
      - name: Publish historical 281 audit for ledger (no formal prediction)
        if: always()
        shell: bash
        run: |
          mkdir -p ../site/data/forum-observer/historical-audits
          python - <<'PY'
          import json,os,pathlib
          from datetime import datetime,timezone
          base=pathlib.Path('audit-281')
          status_file=base/'status.json'
          error_file=base/'collection-error.json'
          run_id=os.environ.get('GITHUB_RUN_ID','')
          data={
              'schema_version':1,
              'source':'forum-281-historical-audit',
              'issue':2026281,
              'historical':True,
              'frozen':False,
              'settled':False,
              'audit_status':'pending',
              'collection_status':'missing_data',
              'collected_at':None,
              'published_at':datetime.now(timezone.utc).isoformat(),
              'raw_posts':None,
              'candidate_materials':None,
              'valid_materials':None,
              'excluded_materials':None,
              'unscored_posts':None,
              'distinct_valid_authors':None,
              'top3':[],
              'top6':[],
              'ranking':[],
              'evidence_links':[],
              'historical_reference_count':0,
              'retrospective_records':[],
              'errors':[],
              'run_url':'https://github.com/ntr361-bot/ntr-v7/actions/runs/'+run_id
          }
          if status_file.exists():
              try:
                  s=json.loads(status_file.read_text(encoding='utf-8'))
                  evidence=s.get('evidence',[])
                  predictions=s.get('parsed_predictions',[])
                  audit=s.get('audit',{})
                  counted=sum(bool(p.get('counted_for_ranking')) for p in predictions)
                  retro=s.get('historical_references',[])
                  retro_valid=(isinstance(retro,list)
                      and s.get('historical_reference_count',0)==len(retro)
                      and all(isinstance(p,dict)
                          and p.get('issue')=='2026281'
                          and p.get('source_post_issue')=='2026282'
                          and p.get('counted_for_ranking') is False
                          and p.get('classification')=='retrospective_after_draw_not_prediction'
                          and str(p.get('source_url','')).startswith('https://')
                          for p in retro))
                  matching=(s.get('issue')=='2026281'
                      and bool(audit.get('issue_filter_strict'))
                      and isinstance(evidence,list)
                      and all(p.get('issue')=='2026281' for p in evidence)
                      and retro_valid and counted==s.get('valid_materials')
                      and counted<=len(predictions))
                  data['collection_status']=str(s.get('status','unknown'))
                  data['collected_at']=s.get('fetched_at')
                  data['raw_posts']=len(evidence) if isinstance(evidence,list) else None
                  data['errors']=[str(e.get('reason','unknown'))[:240] for e in audit.get('detail_errors',[])[:40]]
                  if matching:
                      data['audit_status']='issue_scoped' if evidence else ('retrospective_only' if retro else 'no_281_posts')
                      data['historical_reference_count']=len(retro)
                      data['retrospective_records']=[{
                          'author':str(p.get('author',''))[:80],
                          'source_post_issue':str(p.get('source_post_issue','')),
                          'source_url':str(p.get('source_url','')),
                          'post_published_at':str(p.get('post_published_at','')),
                          'content':str(p.get('content',''))[:450],
                          'classification':'retrospective_after_draw_not_prediction'
                      } for p in retro[:80]]
                      for name in ('candidate_materials','valid_materials','excluded_materials','unscored_posts','distinct_valid_authors'):
                          data[name]=s.get(name,0)
                      ranks=s.get('ranking',[])
                      zodiacs='鼠牛虎兔龙蛇马羊猴鸡狗猪'
                      ranking_ok=(isinstance(ranks,list) and len(ranks)==12
                          and {x.get('zodiac') for x in ranks}==set(zodiacs)
                          and [x.get('rank') for x in ranks]==list(range(1,13))
                          and s.get('top3')==[x.get('zodiac') for x in ranks[:3]]
                          and s.get('top6')==[x.get('zodiac') for x in ranks[:6]])
                      if ranking_ok:
                          data['ranking']=[{'rank':x['rank'],'zodiac':x['zodiac'],'score':x.get('score',0)} for x in ranks]
                          data['top3']=s['top3']
                          data['top6']=s['top6']
                      elif ranks:
                          data['errors'].append('12生肖排名或Top3/Top6不一致，已隐藏')
                      seen=set()
                      for p in predictions:
                          if not p.get('counted_for_ranking'):continue
                          url=str(p.get('source_url',''))
                          if url.startswith('https://') and url not in seen and len(data['evidence_links'])<40:
                              seen.add(url)
                              data['evidence_links'].append({'author':str(p.get('author',''))[:80],'url':url})
                  else:
                      data['audit_status']='validation_failed'
                      data['errors'].append('281期范围或有效资料计数验证失败，拒绝展示排名')
              except Exception as exc:
                  data['audit_status']='invalid_status'
                  data['errors'].append('无法解析状态：'+str(exc)[:300])
          elif error_file.exists():
              try:
                  error=json.loads(error_file.read_text(encoding='utf-8'))
                  data['errors'].append(str(error.get('reason','collector failed'))[:450])
              except Exception:
                  data['errors'].append('采集失败，状态文件不可解析')
          else:
              data['errors'].append('抓取任务未产生状态文件')
          target=pathlib.Path('../site/data/forum-observer/historical-audits/2026281.json')
          target.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:data[k] for k in ('issue','audit_status','collection_status','raw_posts','valid_materials','errors')},ensure_ascii=False))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../site/data/forum-observer/historical-audits/2026281.json
          if git diff --cached --quiet; then
            echo "281 audit report unchanged"
            exit 0
          fi
          git commit -m "chore(forum): publish 281 historical audit for ledger"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum-2026281-historical-audit
          path: |
            forum-observer/audit-281/
            forum-observer/audit-281-exit.txt
          if-no-files-found: ignore
