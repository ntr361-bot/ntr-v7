name: One-time Repair 2026258

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-2026258.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current formal prediction workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-prediction.yml/dispatches" \
            -d '{"ref":"main","inputs":{"issue":"2026258","start_issue":"2026197","force":"false","dry_run":"false","refresh_data":"true","retry_attempt":"0"}}'
          echo "Dispatched formal V7 repair for issue 2026258 with data refresh enabled."
