name: Run V7 Isolated Prediction

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Optional target issue"
        required: false
        type: string
      start_issue:
        description: "Backfill from this issue (default 2026197)"
        required: false
        default: "2026197"
        type: string
      force:
        description: "Deprecated: production frozen forecasts cannot be overwritten"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Validate only; do not write files"
        required: false
        default: false
        type: boolean
      refresh_data:
        description: "Fetch and validate the latest draw data before prediction"
        required: false
        default: true
        type: boolean
      retry_attempt:
        description: "Internal retry marker"
        required: false
        default: "0"
        type: string
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
    # Guarded catch-up when the draw source becomes available after 23:00 CST.
    - cron: "0 16,17,18,19 * * *"
    # Mobile ledger checks for an explicit V7 run request every 15 minutes.
    - cron: "7,22,37,52 * * * *"

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: v7-isolated-prediction-generation
  cancel-in-progress: false

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      retry_allowed: ${{ steps.decide.outputs.retry_allowed }}
    steps:
      - name: Check primary run or failed-run retry
        id: decide
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ inputs.force }}' -eq 'true') { throw 'Frozen production forecasts cannot be overwritten.' }
          $eventName = '${{ github.event_name }}'
          $schedule = '${{ github.event.schedule }}'
          $shouldRun = $eventName -eq 'workflow_dispatch' -or $schedule -eq '0 14 * * *' -or $schedule -eq '0 16,17,18,19 * * *'
          if ($schedule -eq '0 15 * * *') {
            # Retry only if the 22:00 primary run did not complete successfully.
            # If GitHub never started that run, let this scheduled retry recover it.
            $now = [DateTimeOffset]::UtcNow
            $primaryWindowStart = $now.Date.AddHours(14)
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/run-prediction.yml/runs?event=schedule&branch=$env:GITHUB_REF_NAME&per_page=100"
            $runs = Invoke-RestMethod -Uri $uri -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $primary = $runs.workflow_runs | Where-Object {
              ([DateTimeOffset]::Parse($_.created_at) -ge $primaryWindowStart) -and
              ([DateTimeOffset]::Parse($_.created_at) -lt $primaryWindowStart.AddMinutes(30)) -and
              $_.event -eq 'schedule' -and
              $_.head_branch -eq $env:GITHUB_REF_NAME -and $_.id -ne '${{ github.run_id }}'
            } | Sort-Object created_at -Descending | Select-Object -First 1
            if ($null -eq $primary) {
              $shouldRun = $true
              Write-Host '22:00 primary run was not found; enabling recovery run.'
            } elseif ($primary.status -eq 'completed' -and $primary.conclusion -ne 'success') {
              $shouldRun = $true
              Write-Host "22:00 primary run ended with $($primary.conclusion); enabling retry."
            } else {
              $shouldRun = $false
              Write-Host "22:00 primary run status is $($primary.status), conclusion $($primary.conclusion); skipping duplicate run."
            }
          } elseif ($schedule -eq '7,22,37,52 * * * *') {
            try {
              $tokenUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=smart-ledger-v7"
              $oidc = (Invoke-RestMethod -Uri $tokenUrl -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }).value
              if (!$env:SITES_SIWC_BYPASS_TOKEN) { throw 'Missing SITES_SIWC_BYPASS_TOKEN Actions secret.' }
              $headers = @{
                Authorization = "Bearer $oidc"
                'OAI-Sites-Authorization' = "Bearer $env:SITES_SIWC_BYPASS_TOKEN"
              }
              $response = Invoke-RestMethod -Uri 'https://smart-ledger-2026.ntr133.chatgpt.site/api/v7-sync/request' -Headers $headers
              $shouldRun = [bool]$response.run_requested
            } catch {
              Write-Warning "Mobile trigger check failed: $($_.Exception.Message)"
              $shouldRun = $false
            }
          }
          "should_run=$($shouldRun.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $retryAllowed = ![string]::IsNullOrWhiteSpace($env:SITES_SIWC_BYPASS_TOKEN)
          "retry_allowed=$($retryAllowed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}

  predict:
    needs: check-trigger
    if: ${{ needs.check-trigger.outputs.should_run == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore PredictionRunner/PredictionRunner.csproj

      - name: Build prediction runner
        run: dotnet build PredictionRunner/PredictionRunner.csproj --configuration Release --no-restore

      - name: Restore original archived Live evidence once
        shell: pwsh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if (!(Test-Path 'site/data/prediction-traces/history.json.gz')) {
            python PredictionRunner/recover_trace_archive.py
            if ($LASTEXITCODE -ne 0) {
              Write-Warning 'Historical Live-trace recovery failed; do not fabricate old prediction traces.'
              exit 1
            }
          }

      - name: Rebuild history database from committed JSON
        shell: pwsh
        run: |
          dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- --rebuild-db --rebuild-only

      - name: Refresh latest draw data
        if: ${{ github.event_name == 'schedule' || inputs.refresh_data == true }}
        shell: pwsh
        run: |
          $arguments = @('--refresh-data', '--refresh-only')
          if ('${{ inputs.dry_run }}' -eq 'true') { $arguments += '--dry-run' }
          dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- @arguments

      - name: Export refreshed draw archive without predicting
        if: ${{ inputs.dry_run != true }}
        run: dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- --export-history

      - name: Plan next issue without running any model
        id: plan
        shell: pwsh
        env:
          REQUESTED_ISSUE: ${{ inputs.issue }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' }}
        run: python scripts/pipeline_guard.py plan

      - name: Settle existing formal forecasts before generating next issue
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        run: dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- --settle-only

      - name: Generate only a missing next prediction
        if: ${{ inputs.dry_run != true && steps.plan.outputs.generate == 'true' }}
        shell: pwsh
        run: |
          dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- --generate-all --preserve-frozen --issue '${{ steps.plan.outputs.target }}'

      - name: Production safety checks
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        run: |
          $latest = Get-Content 'site/data/predictions/latest.json' -Raw | ConvertFrom-Json
          $target = if ('${{ inputs.issue }}') { [long]'${{ inputs.issue }}' } else { [long]$latest.latest_issue }
          if ([long]$latest.latest_issue -lt $target) { throw "latest.json has not advanced to target issue $target" }

          $history = Get-Content 'site/data/history.json' -Raw | ConvertFrom-Json
          if ([long]$history.latest_issue -ge $target) { throw "history contains target/future draw $target before prediction" }
          if ([long]$history.latest_issue -ne ($target - 1)) { throw "history latest issue $($history.latest_issue) is not target-1 for $target" }

          $predictionPath = "site/data/predictions/$target.json"
          $dailyPath = "site/data/daily-records/$target.json"
          foreach ($path in @($predictionPath, $dailyPath, 'site/data/runtime-state.json', 'site/data/daily-records/manifest.json', 'site/data/prediction-traces/history.json.gz')) {
            if (!(Test-Path $path)) { throw "missing production artifact: $path" }
          }

          $prediction = Get-Content $predictionPath -Raw | ConvertFrom-Json
          $daily = Get-Content $dailyPath -Raw | ConvertFrom-Json
          if ([long]$prediction.issue -ne $target -or $prediction.status -ne 'success') { throw "prediction artifact failed validation for $target" }
          if ([long]$daily.issue -ne $target -or $daily.status -ne 'success') { throw "daily artifact failed validation for $target" }
          if ([long]$daily.source_issue -ne ($target - 1)) { throw "daily source_issue is not target-1 for $target" }
          $model100 = $daily.ai_zodiac.v65_100
          if ($null -eq $model100) { $model100 = $daily.ai_zodiac.'100' }
          $modelAuto = $daily.ai_zodiac.v65_auto
          if ($null -eq $modelAuto) { $modelAuto = $daily.ai_zodiac.auto }
          if ($null -eq $model100 -or $null -eq $modelAuto) { throw "daily artifact missing 100-period or auto-learning model" }
          if (@($model100.top6).Count -ne 6 -or @($modelAuto.top6).Count -ne 6) { throw "production Top6 output is incomplete" }

          $manifest = Get-Content 'site/data/daily-records/manifest.json' -Raw | ConvertFrom-Json
          if (@($manifest.records) -notcontains "$target.json") { throw "manifest does not contain $target.json" }
          python scripts/pipeline_guard.py validate
          if ($LASTEXITCODE -ne 0) { throw 'Formal snapshot consistency failed.' }
          Write-Host "Production safety checks passed for issue $target."

      - name: Commit generated files
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/history.json site/data/predictions site/data/daily-records site/data/runtime-state.json site/data/prediction-traces/history.json.gz
          if (Test-Path 'experiments/v7-independent-learning-v1/archive.json') {
            git add experiments/v7-independent-learning-v1/archive.json
          }
          if (git diff --cached --quiet) {
            Write-Host "No prediction changes to commit."
            exit 0
          }
          $issue = (Get-Content site/data/predictions/latest.json | ConvertFrom-Json).latest_issue
          git commit -m "chore: update V7 prediction for issue $issue"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push origin HEAD:${{ github.ref_name }}
            if ($LASTEXITCODE -eq 0) { exit 0 }
            git pull --rebase origin '${{ github.ref_name }}'
            if ($LASTEXITCODE -ne 0) { throw 'Commit conflict; refusing to overwrite archived predictions.' }
          }
          throw 'Could not persist generated artifacts after three guarded attempts.'

      - name: Upload history database artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: v7-history-db
          path: data/history.db
          if-no-files-found: error
          retention-days: 30

      - name: Publish V7 data to smart ledger
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        run: |
          function Invoke-RequiredPublish {
            param([string]$Url, [hashtable]$Headers, [string]$Body)
            $lastError = $null
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                $response = Invoke-RestMethod -Method Post -Uri $Url -Headers $Headers -ContentType 'application/json' -Body $Body -ErrorAction Stop
                if ($null -ne $response.status -and $response.status -ne 'success') {
                  throw "发布接口返回异常状态：$($response.status)"
                }
                return $response
              } catch {
                $lastError = $_
                if ($attempt -lt 3) { Start-Sleep -Seconds (3 * $attempt) }
              }
            }
            throw "发布失败：$($lastError.Exception.Message)"
          }

          $manifest = Get-Content 'site/data/daily-records/manifest.json' -Raw | ConvertFrom-Json
          $predictions = @{}
          foreach ($file in $manifest.records) {
            $predictions[$file] = Get-Content "site/data/daily-records/$file" -Raw | ConvertFrom-Json
          }
          $modelState = Get-Content 'site/data/runtime-state.json' -Raw | ConvertFrom-Json
          # Temporary wire compatibility for the old deployed ledger guard.
          # Its stored frozen 285 rows say "本地生成"; the repository now says
          # "云端同步". Preserve the original provenance ONLY in the outgoing
          # transport payload. Committed forecasts and settlement stay unchanged.
          $legacy285 = @($modelState.predictions | Where-Object {
            [string]$_.issue -eq '2026285' -and [string]$_.predictionSource -eq '云端同步'
          })
          if ($legacy285.Count -gt 0) {
            if ($legacy285.Count -ne 6) { throw 'Unexpected partial 285 provenance migration; refusing to publish.' }
            foreach ($row in $legacy285) { $row.predictionSource = '本地生成' }
            Write-Host 'Applied legacy 285 provenance compatibility in memory (six rows; no forecast changes).'
          }
          $payload = @{
            history = Get-Content 'site/data/history.json' -Raw | ConvertFrom-Json
            dailyHistory = Get-Content 'site/data/daily-records/history.json' -Raw | ConvertFrom-Json
            manifest = $manifest
            modelState = $modelState
            predictions = $predictions
          } | ConvertTo-Json -Depth 100 -Compress
          $tokenUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=smart-ledger-v7"
          $oidc = (Invoke-RestMethod -Uri $tokenUrl -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" } -ErrorAction Stop).value
          if (!$env:SITES_SIWC_BYPASS_TOKEN) { throw 'Missing SITES_SIWC_BYPASS_TOKEN Actions secret.' }
          $headers = @{
            Authorization = "Bearer $oidc"
            'OAI-Sites-Authorization' = "Bearer $env:SITES_SIWC_BYPASS_TOKEN"
          }
          Invoke-RequiredPublish -Url 'https://smart-ledger-2026.ntr133.chatgpt.site/api/v7-sync/publish' -Headers $headers -Body $payload | Out-Host

          $publishedManifest = Invoke-RestMethod -Uri 'https://smart-ledger-2026.ntr133.chatgpt.site/api/v7-sync/manifest' -Headers $headers -ErrorAction Stop
          $expected = @($manifest.records | ForEach-Object { [string]$_ } | Sort-Object { [int]($_ -replace '\.json$', '') } -Descending)
          $actual = @($publishedManifest.records | ForEach-Object { [string]$_ })
          foreach ($file in $expected) {
            if ($actual -notcontains $file) { throw "发布校验失败：缺少 $file" }
          }
          $latestFile = $expected | Select-Object -First 1
          if ($latestFile) {
            Invoke-RestMethod -Uri "https://smart-ledger-2026.ntr133.chatgpt.site/api/v7-sync/prediction?file=$latestFile" -Headers $headers -ErrorAction Stop | Out-Null
          }
        env:
          SITES_SIWC_BYPASS_TOKEN: ${{ secrets.SITES_SIWC_BYPASS_TOKEN }}

      - name: Report pipeline failure
        if: ${{ failure() }}
        shell: pwsh
        run: |
          Write-Host '::error::Formal pipeline failed. Inspect failed step; committed data will be retried by Sync V7 State. Never force or rerun frozen forecasts.'
          'Formal pipeline failed; see job logs. No automatic model rerun was dispatched.' >> $env:GITHUB_STEP_SUMMARY
