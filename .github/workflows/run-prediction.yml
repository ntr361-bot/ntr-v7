name: Run V6 Stable Prediction

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Optional target issue"
        required: false
        type: string
      start_issue:
        description: "Backfill from this issue (default 2026197)"
        required: false
        default: "2026197"
        type: string
      force:
        description: "Overwrite an existing prediction"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Validate only; do not write files"
        required: false
        default: false
        type: boolean
      refresh_data:
        description: "Fetch and validate the latest draw data before prediction"
        required: false
        default: true
        type: boolean
  # 数据源约北京时间21:40更新。多次错峰重试，降低 GitHub cron 延迟或丢任务的影响；cron 使用 UTC。
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
    # 手机账本的“运行V6”请求每15分钟检查一次，避开上述三个固定时间。

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: v6-stable-prediction-generation
  cancel-in-progress: false

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Check primary run or failed-run retry
        id: decide
        shell: pwsh
        run: |
          $eventName = '${{ github.event_name }}'
          $schedule = '${{ github.event.schedule }}'
          $shouldRun = $eventName -eq 'workflow_dispatch' -or $schedule -eq '0 14 * * *'
          if ($schedule -eq '0 15 * * *') {
            try {
              $headers = @{
                Authorization = "Bearer $env:GITHUB_TOKEN"
                Accept = 'application/vnd.github+json'
                'X-GitHub-Api-Version' = '2022-11-28'
              }
              $uri = 'https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-prediction.yml/runs?event=schedule&per_page=20'
              $runs = (Invoke-RestMethod -Uri $uri -Headers $headers).workflow_runs
              $windowStart = [DateTimeOffset]::UtcNow.Date.AddHours(13.5)
              $currentRunId = [long]'${{ github.run_id }}'
              $primary = $runs |
                Where-Object {
                  [long]$_.id -ne $currentRunId -and
                  [DateTimeOffset]::Parse($_.run_started_at) -ge $windowStart -and
                  [DateTimeOffset]::Parse($_.run_started_at) -lt [DateTimeOffset]::UtcNow
                } |
                Sort-Object { [DateTimeOffset]::Parse($_.run_started_at) } -Descending |
                Select-Object -First 1
              $shouldRun = $null -eq $primary -or $primary.conclusion -ne 'success'
              if ($null -ne $primary) {
                Write-Host "22:00 run $($primary.id) conclusion: $($primary.conclusion)"
              } else {
                Write-Host 'No 22:00 run found; enabling the 23:00 retry.'
              }
            } catch {
              Write-Warning "Could not inspect the 22:00 run; enabling the safe retry: $($_.Exception.Message)"
              $shouldRun = $true
            }
          }
          "should_run=$($shouldRun.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ github.token }}

  predict:
    needs: check-trigger
    if: ${{ needs.check-trigger.outputs.should_run == 'true' }}
    runs-on: windows-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore PredictionRunner/PredictionRunner.csproj

      - name: Build prediction runner
        run: dotnet build PredictionRunner/PredictionRunner.csproj --configuration Release --no-restore

      - name: Refresh latest draw data
        if: ${{ github.event_name == 'schedule' || inputs.refresh_data == true }}
        shell: pwsh
        run: |
          $arguments = @('--refresh-data', '--refresh-only')
          if ('${{ inputs.dry_run }}' -eq 'true') { $arguments += '--dry-run' }
          dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- @arguments

      - name: Validate historical data
        shell: pwsh
        run: |
          $arguments = @('--dry-run', '--generate-all')
          if ('${{ inputs.issue }}') { $arguments += @('--issue', '${{ inputs.issue }}') }
          $startIssue = '${{ inputs.start_issue }}'
          if (!$startIssue) { $startIssue = '2026197' }
          $arguments += @('--start-issue', $startIssue)
          dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- @arguments

      - name: Generate prediction
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        run: |
          $arguments = @('--generate-all')
          if ('${{ inputs.issue }}') { $arguments += @('--issue', '${{ inputs.issue }}') }
          $startIssue = '${{ inputs.start_issue }}'
          if (!$startIssue) { $startIssue = '2026197' }
          $arguments += @('--start-issue', $startIssue)
          if ('${{ inputs.force }}' -eq 'true') { $arguments += '--force' }
          dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- @arguments

      - name: Run tests
        run: dotnet run --project Tests/六合分析软件.SmokeTests.csproj --configuration Release

      - name: Commit generated files
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.db site/data/history.json site/data/predictions site/data/daily-records
          if (git diff --cached --quiet) {
            Write-Host "No prediction changes to commit."
            exit 0
          }
          $issue = (Get-Content site/data/predictions/latest.json | ConvertFrom-Json).latest_issue
          git commit -m "chore: update V6 stable prediction for issue $issue"
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish V6 data to smart ledger
        shell: pwsh
        run: |
          $manifest = Get-Content 'site/data/daily-records/manifest.json' -Raw | ConvertFrom-Json
          $predictions = @{}
          foreach ($file in $manifest.records) {
            $predictions[$file] = Get-Content "site/data/daily-records/$file" -Raw | ConvertFrom-Json
          }
          $payload = @{
            history = Get-Content 'site/data/history.json' -Raw | ConvertFrom-Json
            dailyHistory = Get-Content 'site/data/daily-records/history.json' -Raw | ConvertFrom-Json
            manifest = $manifest
            predictions = $predictions
          } | ConvertTo-Json -Depth 100 -Compress
          $tokenUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=smart-ledger-v6"
          $oidc = (Invoke-RestMethod -Uri $tokenUrl -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }).value
          $headers = @{ "X-V6-GitHub-OIDC" = "Bearer $oidc" }
          Invoke-RestMethod -Method Post -Uri 'https://smart-ledger-2026.ntr133.chatgpt.site/api/v6-sync/publish' -Headers $headers -ContentType 'application/json' -Body $payload
