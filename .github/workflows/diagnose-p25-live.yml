name: Diagnose P25 Live

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-p25-live.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect repository P25 state
        shell: python
        run: |
          import json
          from pathlib import Path
          runtime = json.loads(Path('site/data/runtime-state.json').read_text(encoding='utf-8'))
          preds = runtime.get('predictions') or []
          p25 = [x for x in preds if x.get('modelVersion') == 'P25-Web']
          print('LOCAL_P25_COUNT=', len(p25))
          if p25:
              latest = sorted(p25, key=lambda x: int(x.get('issue') or 0))[-1]
              print('LOCAL_P25_LATEST_ISSUE=', latest.get('issue'))
              print('LOCAL_P25_TOP3=', latest.get('predictZodiac'))
              print('LOCAL_P25_TOP6=', latest.get('top6Zodiac'))
          daily = json.loads(Path('site/data/daily-records/2026258.json').read_text(encoding='utf-8'))
          print('DAILY_AI_KEYS=', ','.join((daily.get('ai_zodiac') or {}).keys()))
      - name: Inspect live smart-ledger API
        shell: python
        run: |
          import json, urllib.request
          url='https://smart-ledger-2026.ntr133.chatgpt.site/api/predictions?diag=1'
          req=urllib.request.Request(url, headers={'User-Agent':'p25-diagnostic'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data=json.load(r)
              print('LIVE_STATUS=', r.status)
          print('LIVE_KEYS=', ','.join(sorted(data.keys())))
          p25=data.get('p25_web_predictions') or []
          print('LIVE_P25_COUNT=', len(p25))
          if p25:
              latest=sorted(p25,key=lambda x:int(x.get('issue') or 0))[-1]
              print('LIVE_P25_LATEST_ISSUE=', latest.get('issue'))
              print('LIVE_P25_TOP3=', ','.join(latest.get('top3') or []))
              print('LIVE_P25_TOP6=', ','.join(latest.get('top6') or []))
          preds=data.get('predictions') or []
          if preds:
              latest=max(preds,key=lambda x:int(x.get('issue') or 0))
              print('LIVE_CLOUD_LATEST_ISSUE=', latest.get('issue'))
              print('LIVE_AI_KEYS=', ','.join((latest.get('ai_zodiac') or {}).keys()))
