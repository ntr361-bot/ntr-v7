name: Cancel Stuck Repair

on:
  push:
    branches: [ops/cancel-stuck-2026258]
    paths:
      - ".github/workflows/cancel-stuck-repair.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck formal repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/34924927088/cancel"
          echo "Cancel requested for run 34924927088"
