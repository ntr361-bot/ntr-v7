name: Local 50 Residual Audit

on:
  workflow_dispatch:
  push:
    branches:
      - validation/1000-walkforward-20260913
    paths:
      - "Tests/Local50AuditRunner/**"
      - ".github/workflows/validate-local50-audit.yml"

permissions:
  contents: write

jobs:
  local50-audit:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      LIUHE_DATA_DIR: ${{ github.workspace }}\data

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        shell: pwsh
        run: |
          dotnet restore PredictionRunner/PredictionRunner.csproj
          dotnet build PredictionRunner/PredictionRunner.csproj --configuration Release --no-restore
          dotnet restore Tests/Local50AuditRunner/Local50AuditRunner.csproj
          dotnet build Tests/Local50AuditRunner/Local50AuditRunner.csproj --configuration Release --no-restore

      - name: Rebuild isolated history database
        shell: pwsh
        run: |
          dotnet run `
            --project PredictionRunner/PredictionRunner.csproj `
            --configuration Release `
            --no-build `
            -- `
            --rebuild-db `
            --rebuild-only

      - name: Run residual audit
        shell: pwsh
        run: |
          dotnet run `
            --project Tests/Local50AuditRunner/Local50AuditRunner.csproj `
            --configuration Release `
            --no-build | Tee-Object -FilePath docs/local50-audit-console.log

      - name: Commit research report
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/local50-audit-report.json docs/local50-audit-report.md docs/local50-audit-console.log
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "test: record 50-window residual audit"
          git pull --rebase origin validation/1000-walkforward-20260913
          git push origin HEAD:validation/1000-walkforward-20260913
