name: Check P25 Web Materials

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. 04:00 UTC = 12:00 China Standard Time.
    - cron: "0 4 * * *"
    # 09:00 UTC = 17:00 China Standard Time. If noon already produced P25, code skips the web request.
    - cron: "0 9 * * *"
    # 16:00 UTC = 00:00 China Standard Time. Settle only the already-frozen P25 after the draw data is stable.
    - cron: "0 16 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: p25-web-material-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore PredictionRunner/PredictionRunner.csproj

      - name: Build prediction runner
        run: dotnet build PredictionRunner/PredictionRunner.csproj --configuration Release --no-restore

      - name: Rebuild runtime database
        shell: pwsh
        run: dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- --rebuild-db --rebuild-only

      - name: Refresh draw data for P25 settlement
        if: ${{ github.event.schedule == '0 16 * * *' }}
        shell: pwsh
        run: dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- --refresh-data --settle-p25-web

      - name: Check P25 website materials
        if: ${{ github.event.schedule != '0 16 * * *' }}
        shell: pwsh
        run: dotnet run --project PredictionRunner/PredictionRunner.csproj --configuration Release --no-build -- --check-p25-web

      - name: Commit P25 check state
        id: commit
        shell: pwsh
        run: |
          $runtimeChanged = $false
          git diff --quiet -- site/data/runtime-state.json
          if ($LASTEXITCODE -ne 0) { $runtimeChanged = $true }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/runtime-state.json
          if (Test-Path 'site/data/predictions/website-learning-archive.json') {
            git add site/data/predictions/website-learning-archive.json
          }
          if (Test-Path 'site/data/predictions/p25-web-check.json') {
            git add site/data/predictions/p25-web-check.json
          }
          if (Test-Path 'site/data/predictions/p25-web-settlement.json') {
            git add site/data/predictions/p25-web-settlement.json
          }

          "runtime_changed=$($runtimeChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (git diff --cached --quiet) {
            "changed=false" >> $env:GITHUB_OUTPUT
            Write-Host 'No P25 state changes to commit.'
            exit 0
          }

          $check = $null
          if (Test-Path 'site/data/predictions/p25-web-check.json') {
            $check = Get-Content 'site/data/predictions/p25-web-check.json' -Raw | ConvertFrom-Json
          }
          $issue = if ($null -ne $check) { [string]$check.target_issue } else { 'current' }
          git commit -m "chore: update P25 web check for issue $issue"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
          "changed=true" >> $env:GITHUB_OUTPUT

      - name: Publish updated P25 runtime state to smart ledger
        if: ${{ steps.commit.outputs.runtime_changed == 'true' }}
        shell: pwsh
        run: |
          function Invoke-RequiredPublish {
            param([string]$Url, [hashtable]$Headers, [string]$Body)
            $lastError = $null
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                $response = Invoke-RestMethod -Method Post -Uri $Url -Headers $Headers -ContentType 'application/json' -Body $Body -ErrorAction Stop
                if ($null -ne $response.status -and $response.status -ne 'success') {
                  throw "发布接口返回异常状态：$($response.status)"
                }
                return $response
              } catch {
                $lastError = $_
                if ($attempt -lt 3) { Start-Sleep -Seconds (3 * $attempt) }
              }
            }
            throw "发布失败：$($lastError.Exception.Message)"
          }

          $manifest = Get-Content 'site/data/daily-records/manifest.json' -Raw | ConvertFrom-Json
          $predictions = @{}
          foreach ($file in $manifest.records) {
            $predictions[$file] = Get-Content "site/data/daily-records/$file" -Raw | ConvertFrom-Json
          }
          $payload = @{
            history = Get-Content 'site/data/history.json' -Raw | ConvertFrom-Json
            dailyHistory = Get-Content 'site/data/daily-records/history.json' -Raw | ConvertFrom-Json
            manifest = $manifest
            modelState = Get-Content 'site/data/runtime-state.json' -Raw | ConvertFrom-Json
            predictions = $predictions
          } | ConvertTo-Json -Depth 100 -Compress

          $tokenUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=smart-ledger-v7"
          $oidc = (Invoke-RestMethod -Uri $tokenUrl -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" } -ErrorAction Stop).value
          $headers = @{ Authorization = "Bearer $oidc" }
          Invoke-RequiredPublish -Url 'https://smart-ledger-2026.ntr133.chatgpt.site/api/v7-sync/publish' -Headers $headers -Body $payload | Out-Host
