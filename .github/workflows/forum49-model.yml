name: 49论坛模型 collection
# Manual / externally triggered collection of 49图库 高手论坛 (Macau only).
# Reuses the existing collector and parser unchanged (>=6 zodiac, kill-zodiac
# rules, one material per author). Records an observation per run under
# forum-observer/forum49/; never freezes, settles, publishes to the ledger,
# or touches the formal forum archive, D1 or V7.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Target issue YYYYNNN (blank = latest)
        required: false
        default: ''
      url:
        description: Forum URL
        required: false
        default: https://49217.com/#/forum
permissions:
  contents: write
concurrency:
  group: forum49-model
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: forum-observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Unit tests
        run: python -m unittest tests.test_forum49 tests.test_source_probe -v
      - name: Collect (no limit on post count; stops at issue boundary)
        id: collect
        env:
          F49_ISSUE: ${{ inputs.issue }}
          F49_URL: ${{ inputs.url }}
        run: |
          python -u -m forum_observer.forum49 --url "$F49_URL" --issue "$F49_ISSUE" --category 澳门 --out forum49-out --archive forum49
      - name: Report (annotations + summary)
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          def esc(x): return x.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          p=Path('forum49-out/forum49-summary.json')
          if not p.exists():
              print('::error title=49论坛模型::no summary produced (see log)'); raise SystemExit
          s=json.loads(p.read_text())
          head={k:s.get(k) for k in ('model','ok','error','requested_issue','issue','issue_matches_request',
                'detail_posts','nonempty_article_posts','valid_materials','distinct_valid_authors',
                'material_counts','elapsed_seconds','excluded_reasons')}
          head['top12_observation']=[[r['zodiac'],r['score']] for r in s.get('ranking_observation',[])]
          print('::notice title=49论坛模型 summary::'+esc(json.dumps(head,ensure_ascii=False)[:3800]))
          counted=[f"{m['author']}|{m['play']}|{''.join(m['picks'] or [])}" for m in s.get('materials',[]) if m['counted']]
          for i in range(0,len(counted),45):
              print(f'::notice title=49论坛模型 materials {i//45+1}::'+esc('\n'.join(counted[i:i+45])[:3800]))
          lines=['## 49论坛模型',f"- ok: {s.get('ok')} error: {s.get('error')}",
                 f"- issue: {s.get('issue')} (requested {s.get('requested_issue')})",
                 f"- posts: {s.get('detail_posts')} valid materials: {s.get('valid_materials')} authors: {s.get('distinct_valid_authors')}",
                 f"- material counts: {s.get('material_counts')}",
                 '- frozen / settled / ledger: none (observation only)']
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit run record (forum49/ only)
        if: always()
        shell: bash
        run: |
          [ -d forum49 ] || { echo "no record"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forum49/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(forum49): record 49论坛模型 collection run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum49-model
          path: forum-observer/forum49-out/
