name: 49论坛模型 collection
# 49图库 高手论坛 (Macau only).
# Reuses the 118论坛模型 collector, parser and freeze/settle cycle unchanged
# (>=6 zodiac, kill-zodiac, one material per author; AGENTS.md 1-10), with its
# own archive forum-observer/forum49/ and feed site/data/forum49/.
#   mode=collect : explicit request -> replaceable current-issue draft (never a freeze).
#   mode=freeze  : explicit request -> immutable current-issue draft
#   mode=settle  : settle snapshots from verified draw history; never collects
# Never touches 118's archive/feed, D1 or formal V7.
# Startup flow aligned with Forum observer (single job for collect/freeze).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: collect | freeze | settle
        type: choice
        options: [collect, freeze, settle]
        required: false
        default: collect
      issue:
        description: Target issue YYYYNNN (blank = latest)
        required: false
        default: ''
      url:
        description: Forum URL
        required: false
        default: https://49217.com/#/forum
      scrapling_check:
        description: Run Scrapling side-by-side check after collection (off by default)
        required: false
        default: 'false'
      skip_if_collected:
        description: Skip when an existing current-issue draft is present
        required: false
        default: 'false'
  schedule:
    # Beijing 20:20 collect / 20:35 backup / 21:00 freeze / 21:10 backup.
    - cron: "20 12 * * *"
    - cron: "35 12 * * *"
    - cron: "0 13 * * *"
    - cron: "10 13 * * *"
permissions:
  contents: write
concurrency:
  group: forum49-archive
  cancel-in-progress: false
defaults:
  run:
    working-directory: forum-observer
jobs:
  forum49-cycle:
    # Collect or freeze (settle is a separate job).
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'settle') }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide current-issue collection
        id: collection-gate
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mode || 'collect') == 'collect') || (github.event_name == 'schedule' && github.event.schedule != '0 13 * * *' && github.event.schedule != '10 13 * * *') }}
        env:
          F49_SKIP_IF_COLLECTED: ${{ github.event_name == 'schedule' && 'true' || inputs.skip_if_collected || 'false' }}
        run: python -m forum_observer.schedule --archive forum49 --github-output "$GITHUB_OUTPUT" --forum49-collect-gate

      - name: Install browser
        if: steps.collection-gate.outputs.collect == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Unit tests
        if: steps.collection-gate.outputs.collect == 'true'
        run: python -m unittest tests.test_forum49 tests.test_forum49_scrapling tests.test_forum49_cycle tests.test_source_probe -v

      - name: Isolate archive for a manual test after the freeze time
        if: steps.collection-gate.outputs.test == 'true'
        run: |
          echo "::notice title=49论坛模型 test::manual run after the freeze time; test only (artifact), no draft/freeze/commit"
          rm -rf /tmp/forum49-test && cp -r forum49 /tmp/forum49-test

      - name: Collect (no limit on post count; stops at issue boundary)
        id: collect
        if: steps.collection-gate.outputs.collect == 'true'
        env:
          F49_ISSUE: ${{ inputs.issue }}
          F49_URL: ${{ inputs.url || 'https://49217.com/#/forum' }}
          F49_ARCHIVE: ${{ steps.collection-gate.outputs.test == 'true' && '/tmp/forum49-test' || 'forum49' }}
        run: |
          python -u -m forum_observer.forum49 --url "$F49_URL" --issue "$F49_ISSUE" --category 澳门 --out forum49-out --archive "$F49_ARCHIVE"

      - name: Publish pre-freeze draft (no freeze; refused at/after 21:00)
        id: draft
        if: steps.collect.outcome == 'success' && steps.collection-gate.outputs.test != 'true'
        continue-on-error: true
        run: |
          python -m forum_observer.cycle --out forum49-out --archive forum49 \
            --history ../site/data/history.json --public ../site/data/forum49 \
            --defer-freeze --model-id forum49

      - name: Check freeze window
        id: freeze-window
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'freeze') || (github.event_name == 'schedule' && (github.event.schedule == '0 13 * * *' || github.event.schedule == '10 13 * * *')) }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m forum_observer.schedule --archive forum49 --github-output "$GITHUB_OUTPUT" --check-freeze-window --manual-freeze
          else
            python -m forum_observer.schedule --archive forum49 --github-output "$GITHUB_OUTPUT" --check-freeze-window
          fi

      - name: Reject freeze without an eligible current-issue draft
        if: steps.freeze-window.outputs.allowed == 'false'
        run: |
          echo "::error title=49论坛模型 freeze::refused (${{ steps.freeze-window.outputs.reason }}); no eligible current-issue draft exists"
          exit 1

      - name: Publish completed-run report or finalize freeze
        if: ${{ always() && steps.collection-gate.outputs.test != 'true' }}
        env:
          FINALIZE_CYCLE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'freeze') || (github.event_name == 'schedule' && (github.event.schedule == '0 13 * * *' || github.event.schedule == '10 13 * * *')) }}
        run: |
          if [ "$FINALIZE_CYCLE" = "true" ]; then
            python -m forum_observer.cycle --out forum49-no-collection --archive forum49 \
              --history ../site/data/history.json --public ../site/data/forum49 \
              --finalize --model-id forum49
          elif [ "${{ steps.collect.outcome }}" = "success" ]; then
            # Draft already published above; this is a no-op safety path for non-freeze.
            echo "Draft path already handled"
          fi

      - name: Record 49 author history from verified frozen evidence only
        if: ${{ always() && steps.collection-gate.outputs.test != 'true' }}
        continue-on-error: true
        run: python -m forum_observer.author_profiles --archive forum49

      - name: Archive independent forum data only
        if: ${{ always() && steps.collection-gate.outputs.test != 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forum49/ ../site/data/forum49/
          if git diff --cached --quiet; then
            echo "No forum49 archive changes"
            exit 0
          fi
          git commit -m "chore(forum49): 49论坛模型 cycle ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || true
          done
          exit 1

      - name: Scrapling side-by-side check (isolated; never affects collection)
        if: ${{ always() && inputs.scrapling_check == 'true' && steps.collect.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 40
        run: |
          python -m venv /tmp/scrapling-venv
          /tmp/scrapling-venv/bin/pip install -q "scrapling[fetchers]"
          /tmp/scrapling-venv/bin/python -m playwright install chromium
          /tmp/scrapling-venv/bin/scrapling install || echo "scrapling install step unavailable; continuing"
          /tmp/scrapling-venv/bin/python -u -m forum_observer.forum49_scrapling --budget-seconds 1800 --archive "${{ steps.collection-gate.outputs.test == 'true' && '/tmp/forum49-test' || 'forum49' }}"

      - name: Report (annotations + summary)
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          def esc(x): return x.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          p=Path('forum49-out/forum49-summary.json')
          if p.exists():
              s=json.loads(p.read_text())
              head={k:s.get(k) for k in ('model','ok','error','requested_issue','issue','issue_matches_request',
                    'detail_posts','nonempty_article_posts','valid_materials','distinct_valid_authors',
                    'material_counts','elapsed_seconds','excluded_reasons')}
              print('::notice title=49论坛模型 summary::'+esc(json.dumps(head,ensure_ascii=False)[:3800]))
          else:
              print('::notice title=49论坛模型::no summary (gate may have skipped collect)')
          Path(os.environ.get('GITHUB_STEP_SUMMARY','/dev/stdout')).write_text('## 49论坛模型 cycle completed\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum49-model
          path: forum-observer/forum49-out/
          if-no-files-found: ignore

  settle:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'settle' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Settle from verified draw history (never collects or freezes)
        run: |
          python -m forum_observer.cycle \
            --out forum49-no-collection \
            --archive forum49 \
            --history ../site/data/history.json \
            --public ../site/data/forum49 \
            --model-id forum49
      - name: Record 49 author history from verified frozen evidence only
        continue-on-error: true
        run: python -m forum_observer.author_profiles --archive forum49
      - name: Commit settlement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forum49/ ../site/data/forum49/
          if git diff --cached --quiet; then echo "no new settlement"; exit 0; fi
          git commit -m "chore(forum49): settle 49论坛模型 from verified draw history"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || true
          done
          exit 1
