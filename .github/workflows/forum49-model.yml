name: 49论坛模型 collection
# 49图库 高手论坛 (Macau only), triggered externally (scheduled tasks).
# Reuses the 118论坛模型 collector, parser and freeze/settle cycle unchanged
# (>=6 zodiac, kill-zodiac, one material per author; AGENTS.md 1-10), with its
# own archive forum-observer/forum49/ and feed site/data/forum49/.
#   mode=collect : single 20:20 collection (since 2026-10-26) -> replaceable draft (never a freeze).
#                  Automatic runs (backup cron below, or dispatch with
#                  skip_if_collected=true) collect once per night in 20:20-20:50;
#                  a manual dispatch (default skip_if_collected=false) always collects.
#   mode=freeze  : 21:00-21:20 only -> immutable snapshot of last pre-21:00 draft
#   mode=settle  : settle snapshots from verified draw history; never collects
# Never touches 118's archive/feed, D1 or formal V7.
on:
  schedule:
    # Hourly settlement only (never collects or freezes); delays are harmless.
    - cron: '50 * * * *'
    # Independent backups (user decision 2026-10-26), Beijing 20:20/20:25
    # collect and 21:00/21:05/21:10 freeze. Collect skips when tonight's draft
    # exists; freeze keeps its 21:00-21:20 window and write-once snapshot.
    - cron: '20,25 12 * * *'
    - cron: '0,5,10 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: collect | freeze | settle
        required: false
        default: collect
      issue:
        description: Target issue YYYYNNN (blank = latest)
        required: false
        default: ''
      url:
        description: Forum URL
        required: false
        default: https://49217.com/#/forum
      scrapling_check:
        description: Run Scrapling side-by-side check after collection
        required: false
        default: 'true'
      skip_if_collected:
        description: Skip when tonight's draft already exists (automatic runs only; manual = false)
        required: false
        default: 'false'
permissions:
  contents: write
concurrency:
  group: forum49-${{ github.event.schedule == '20,25 12 * * *' && 'collect' || github.event.schedule == '0,5,10 13 * * *' && 'freeze' || github.event_name == 'schedule' && 'settle' || inputs.mode || 'collect' }}
  cancel-in-progress: false
jobs:
  gate:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mode || 'collect') == 'collect') || (github.event_name == 'schedule' && github.event.schedule == '20,25 12 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      collect: ${{ steps.gate.outputs.collect }}
      test: ${{ steps.gate.outputs.test }}
    defaults:
      run:
        working-directory: forum-observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide whether to collect (automatic runs collect once per night)
        id: gate
        env:
          F49_SKIP_IF_COLLECTED: ${{ github.event_name == 'schedule' && 'true' || inputs.skip_if_collected || 'false' }}
        run: python -m forum_observer.schedule --archive forum49 --github-output "$GITHUB_OUTPUT" --forum49-collect-gate

  collect:
    needs: gate
    if: ${{ needs.gate.outputs.collect == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    defaults:
      run:
        working-directory: forum-observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Unit tests
        run: python -m unittest tests.test_forum49 tests.test_forum49_scrapling tests.test_forum49_cycle tests.test_source_probe -v
      - name: Isolate archive for a manual test after the freeze time
        # From 21:00 a manual run is a test: it reads/writes a throwaway copy
        # and never publishes a draft or commits anything.
        if: needs.gate.outputs.test == 'true'
        run: |
          echo "::notice title=49论坛模型 test::manual run after the freeze time; test only (artifact), no draft/freeze/commit"
          rm -rf /tmp/forum49-test && cp -r forum49 /tmp/forum49-test
      - name: Collect (no limit on post count; stops at issue boundary)
        id: collect
        env:
          F49_ISSUE: ${{ inputs.issue }}
          F49_URL: ${{ inputs.url || 'https://49217.com/#/forum' }}
          F49_ARCHIVE: ${{ needs.gate.outputs.test == 'true' && '/tmp/forum49-test' || 'forum49' }}
        run: |
          python -u -m forum_observer.forum49 --url "$F49_URL" --issue "$F49_ISSUE" --category 澳门 --out forum49-out --archive "$F49_ARCHIVE"
      - name: Publish pre-freeze draft (no freeze; refused at/after 21:00)
        id: draft
        if: steps.collect.outcome == 'success' && needs.gate.outputs.test != 'true'
        continue-on-error: true
        run: |
          python -m forum_observer.cycle --out forum49-out --archive forum49 \
            --history ../site/data/history.json --public ../site/data/forum49 \
            --defer-freeze --model-id forum49
      - name: Commit draft and run record before the side check
        if: always() && needs.gate.outputs.test != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d forum49 ] && git add forum49/
          [ -d ../site/data/forum49 ] && git add ../site/data/forum49/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(forum49): 49论坛模型 collection draft ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - name: Scrapling side-by-side check (isolated; never affects collection)
        id: scrapling
        if: always() && inputs.scrapling_check != 'false' && hashFiles('forum-observer/forum49-out/forum49-evidence.json') != ''
        continue-on-error: true
        timeout-minutes: 40
        run: |
          # Separate venv so Scrapling's dependencies cannot change the
          # primary collector's Playwright installation.
          python -m venv /tmp/scrapling-venv
          # Current release (0.5 had no plain browser fetcher); the version
          # and fetcher actually used are recorded in the comparison file.
          /tmp/scrapling-venv/bin/pip install -q "scrapling[fetchers]"
          /tmp/scrapling-venv/bin/python -m playwright install chromium
          /tmp/scrapling-venv/bin/scrapling install || echo "scrapling install step unavailable; continuing"
          /tmp/scrapling-venv/bin/python -u -m forum_observer.forum49_scrapling --budget-seconds 1800 --archive "${{ needs.gate.outputs.test == 'true' && '/tmp/forum49-test' || 'forum49' }}"
      - name: Report (annotations + summary)
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          def esc(x): return x.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          p=Path('forum49-out/forum49-summary.json')
          if not p.exists():
              print('::error title=49论坛模型::no summary produced (see log)'); raise SystemExit
          s=json.loads(p.read_text())
          head={k:s.get(k) for k in ('model','ok','error','requested_issue','issue','issue_matches_request',
                'detail_posts','nonempty_article_posts','valid_materials','distinct_valid_authors',
                'material_counts','elapsed_seconds','excluded_reasons')}
          head['top12_observation']=[[r['zodiac'],r['score']] for r in s.get('ranking_observation',[])]
          sh=s.get('shadow_scope') or {}
          head['shadow_scope']={k:sh.get(k) for k in ('error','scope','opened_posts','kept_posts','valid_materials',
                                'distinct_valid_authors','material_counts','top6')}
          print('::notice title=49论坛模型 summary::'+esc(json.dumps(head,ensure_ascii=False)[:3800]))
          st=s.get('strict_shadow') or {}
          if st:
              sh2={k:st.get(k) for k in ('error','used_for_freeze','valid_materials','distinct_valid_authors',
                   'material_counts','top6','excluded_reasons')}
              sh2['dropped']=len(st.get('dropped_authors') or [])
              sh2['changed']=len(st.get('changed_material_authors') or [])
              sh2['added']=len(st.get('added_authors') or [])
              print('::notice title=49论坛模型 strict shadow (test only)::'+esc(json.dumps(sh2,ensure_ascii=False)[:3800]))
          counted=[f"{m['author']}|{m['play']}|{''.join(m['picks'] or [])}" for m in s.get('materials',[]) if m['counted']]
          for i in range(0,len(counted),45):
              print(f'::notice title=49论坛模型 materials {i//45+1}::'+esc('\n'.join(counted[i:i+45])[:3800]))
          sc=Path('forum49-out/scrapling-compare.json')
          if sc.exists():
              c=json.loads(sc.read_text())
              m=c.get('materials') or {}
              print('::notice title=49论坛模型 scrapling summary::'+esc(json.dumps({
                  'ok':c.get('ok'),'error':c.get('error'),'primary_posts':c.get('primary_posts'),
                  'checked_posts':c.get('checked_posts'),'identical_text_posts':c.get('identical_text_posts'),
                  'fetch_status_counts':c.get('fetch_status_counts'),
                  'material_tally':m.get('tally'),'primary_valid':m.get('primary_valid'),
                  'scrapling_valid':m.get('scrapling_valid'),'agree':m.get('agree')},ensure_ascii=False)[:3800]))
              diff=[f"{r['author']}|{r['status']}|主:{r['primary']}|S:{r['scrapling']}" for r in m.get('authors',[]) if r['status']!='same']
              if diff:
                  print('::notice title=49论坛模型 scrapling differences::'+esc('\n'.join(diff)[:3800]))
              errs=sorted({str(r.get('error'))[:120] for r in c.get('posts',[]) if r.get('error')})[:8]
              if errs:
                  print('::notice title=49论坛模型 scrapling errors::'+esc('\n'.join(errs)))
          print('::notice title=49论坛模型 draft::draft step outcome: ${{ steps.draft.outcome }}')
          lines=['## 49论坛模型',f"- ok: {s.get('ok')} error: {s.get('error')}",
                 "- draft publication: ${{ steps.draft.outcome }}",
                 f"- issue: {s.get('issue')} (requested {s.get('requested_issue')})",
                 f"- posts: {s.get('detail_posts')} valid materials: {s.get('valid_materials')} authors: {s.get('distinct_valid_authors')}",
                 f"- material counts: {s.get('material_counts')}",
                 '- freeze happens only in mode=freeze at 21:00-21:20']
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit Scrapling record (forum49/ only)
        if: always() && needs.gate.outputs.test != 'true'
        shell: bash
        run: |
          [ -d forum49 ] || { echo "no record"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forum49/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(forum49): record 49论坛模型 side check ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forum49-model
          path: forum-observer/forum49-out/

  freeze:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'freeze') || (github.event_name == 'schedule' && github.event.schedule == '0,5,10 13 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: forum-observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check 21:00-21:20 Asia/Shanghai window and evening draft
        id: window
        run: python -m forum_observer.schedule --archive forum49 --github-output "$GITHUB_OUTPUT" --check-freeze-window
      - name: Reject freeze outside window
        if: steps.window.outputs.allowed != 'true'
        run: |
          echo "::error title=49论坛模型 freeze::refused (${{ steps.window.outputs.reason }}); no late or early freeze attempted"
          exit 1
      - name: Freeze last pre-21:00 draft (write-once snapshot)
        run: |
          python -m forum_observer.cycle --out forum49-no-collection --archive forum49 \
            --history ../site/data/history.json --public ../site/data/forum49 \
            --finalize --model-id forum49
      - name: Record 49 author history from verified frozen evidence only
        # Same append-only author memory as 118论坛模型, separate archive
        # (forum49/author-profiles/). No scraping, rescoring or frozen edits;
        # never feeds predictions. A failure here never blocks the commit.
        continue-on-error: true
        run: python -m forum_observer.author_profiles --archive forum49
      - name: Report snapshot
        if: always()
        run: |
          python - <<'PY'
          import json, glob
          from pathlib import Path
          p=Path('../site/data/forum49/latest.json')
          s=json.loads(p.read_text()) if p.exists() else {}
          print('::notice title=49论坛模型 freeze::'+json.dumps({k:s.get(k) for k in (
              'issue','frozen','prediction_top3','prediction_top6','valid_materials',
              'freeze_quality_status','snapshot_digest')},ensure_ascii=False))
          PY
      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forum49/ ../site/data/forum49/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(forum49): 49论坛模型 21:00 freeze ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1

  settle:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '50 * * * *') || inputs.mode == 'settle' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: forum-observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Settle from verified draw history (never collects or freezes)
        run: |
          python -m forum_observer.cycle --out forum49-no-collection --archive forum49 \
            --history ../site/data/history.json --public ../site/data/forum49 --model-id forum49
      - name: Record 49 author history from verified frozen evidence only
        # Same append-only author memory as 118论坛模型, separate archive
        # (forum49/author-profiles/). No scraping, rescoring or frozen edits;
        # never feeds predictions. A failure here never blocks the commit.
        continue-on-error: true
        run: python -m forum_observer.author_profiles --archive forum49
      - name: Commit settlement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forum49/ ../site/data/forum49/
          if git diff --cached --quiet; then echo "no new settlement"; exit 0; fi
          git commit -m "chore(forum49): settle 49论坛模型 from verified draw history"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
