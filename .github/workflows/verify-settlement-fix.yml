name: Verify Settlement and Trace Fix

on:
  pull_request:
    paths:
      - 'PublishedSettlementReconciliation.cs'
      - 'PredictionTraceArchive.cs'
      - 'PredictionRunner/**'
      - 'Tests/Program.cs'
      - '.github/workflows/run-prediction.yml'
      - '.github/workflows/verify-settlement-fix.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build prediction runner (compile only; no live predictions)
        run: dotnet build PredictionRunner/PredictionRunner.csproj -c Release
      - name: Restore authentic 280 and 281 trace fixtures (no live prediction)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python PredictionRunner/recover_trace_archive.py
      - name: Build isolated settlement tests
        run: dotnet build Tests/SettlementRepairSmoke.csproj -c Release
      - name: Execute isolated settlement tests
        run: dotnet run --project Tests/SettlementRepairSmoke.csproj --configuration Release --no-build
